<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 10,5 0,10" fill="#153A5B"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 10,5 0,10" fill="#E28A22"/>
    </marker>
  </defs>
  <rect id="slide-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="56 28 1168 102">
    <text x="56" y="54" font-size="17" font-weight="700" letter-spacing="1.2" fill="#0E7490">第 9–10 节｜方法借鉴与验证样例</text>
    <text x="56" y="103" font-size="42" font-weight="700" fill="#153A5B">借鉴 VeriSMo 的边界思想，用三个操作闭合最小验证案例</text>
    <line x1="56" y1="124" x2="1224" y2="124" stroke="#CCD8E2" stroke-width="2"/>
  </g>

  <g id="verismo-transfer" data-pptx-bounds="56 148 1200 160">
    <text x="56" y="176" font-size="20" font-weight="700" fill="#0E7490">方法迁移：保留思想，不照搬证明规模</text>
    <rect x="56" y="202" width="1168" height="96" fill="#FFFFFF" stroke="#CCD8E2" stroke-width="2"/>
    <line x1="445" y1="202" x2="445" y2="298" stroke="#CCD8E2" stroke-width="2"/>
    <line x1="834" y1="202" x2="834" y2="298" stroke="#CCD8E2" stroke-width="2"/>
    <circle cx="92" cy="250" r="22" fill="#0E7490"/>
    <text x="92" y="257" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">留</text>
    <text x="128" y="239" font-size="22" font-weight="700" fill="#153A5B">保留</text>
    <text x="128" y="270" font-size="17" fill="#18212B">以借用边界隔离 unsafe，并让 proof boundary 可审计</text>
    <circle cx="481" cy="250" r="22" fill="#153A5B"/>
    <text x="481" y="257" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">简</text>
    <text x="517" y="239" font-size="22" font-weight="700" fill="#153A5B">简化</text>
    <text x="517" y="270" font-size="17" fill="#18212B">从整机验证收敛到顺序页管理与局部非干扰</text>
    <circle cx="870" cy="250" r="22" fill="#E28A22"/>
    <text x="870" y="257" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">换</text>
    <text x="906" y="239" font-size="22" font-weight="700" fill="#153A5B">替换</text>
    <text x="906" y="270" font-size="16" fill="#18212B">以 Charon + Aeneas + Rocq 对接真实 Rust 源码</text>
  </g>

  <g id="minimal-page-lifecycle" data-pptx-bounds="56 324 1168 248">
    <text x="56" y="352" font-size="20" font-weight="700" fill="#0E7490">最小案例：一页内存从授权访问到安全重分配</text>
    <line x1="164" y1="442" x2="1110" y2="442" stroke="#CCD8E2" stroke-width="6"/>

    <rect x="80" y="389" width="230" height="106" fill="#F3F6F8" stroke="#153A5B" stroke-width="2"/>
    <text x="195" y="423" text-anchor="middle" font-family="Consolas, Microsoft YaHei, Arial, monospace" font-size="19" font-weight="700" fill="#153A5B">Page(owner = d₁)</text>
    <text x="195" y="455" text-anchor="middle" font-size="17" fill="#18212B">contents = secret₁</text>
    <text x="195" y="481" text-anchor="middle" font-size="16" fill="#0E7490">仅 d₁ / shared_with 可访问</text>

    <line x1="310" y1="442" x2="418" y2="442" stroke="#153A5B" stroke-width="3" marker-end="url(#arrow-primary)"/>
    <rect x="326" y="365" width="76" height="28" fill="#FFFFFF"/>
    <text x="364" y="386" text-anchor="middle" font-family="Consolas, Microsoft YaHei, Arial, monospace" font-size="16" font-weight="700" fill="#153A5B">release_page</text>

    <rect x="422" y="389" width="230" height="106" fill="#FFFFFF" stroke="#E28A22" stroke-width="3"/>
    <text x="537" y="423" text-anchor="middle" font-family="Consolas, Microsoft YaHei, Arial, monospace" font-size="19" font-weight="700" fill="#153A5B">Page(owner = None)</text>
    <text x="537" y="455" text-anchor="middle" font-size="17" fill="#18212B">contents = zero_page</text>
    <text x="537" y="481" text-anchor="middle" font-size="16" font-weight="700" fill="#E28A22">cleared = true</text>

    <line x1="652" y1="442" x2="760" y2="442" stroke="#E28A22" stroke-width="3" marker-end="url(#arrow-accent)"/>
    <rect x="668" y="365" width="76" height="28" fill="#FFFFFF"/>
    <text x="706" y="386" text-anchor="middle" font-family="Consolas, Microsoft YaHei, Arial, monospace" font-size="16" font-weight="700" fill="#E28A22">reassign_page</text>

    <rect x="764" y="389" width="230" height="106" fill="#F3F6F8" stroke="#0E7490" stroke-width="2"/>
    <text x="879" y="423" text-anchor="middle" font-family="Consolas, Microsoft YaHei, Arial, monospace" font-size="19" font-weight="700" fill="#153A5B">Page(owner = d₂)</text>
    <text x="879" y="455" text-anchor="middle" font-size="17" fill="#18212B">contents = zero_page</text>
    <text x="879" y="481" text-anchor="middle" font-size="16" fill="#0E7490">旧域数据不进入新域</text>

    <rect x="1028" y="377" width="172" height="130" fill="#153A5B"/>
    <!-- icon: tabler-outline/shield-check -->
  <g transform="translate(1089, 394) scale(2.08333)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="1114" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">证明闭环</text>
    <text x="1114" y="493" text-anchor="middle" font-size="16" fill="#FFFFFF">授权 + 清零 + 不变式</text>

    <rect x="80" y="518" width="914" height="42" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/>
    <!-- icon: tabler-outline/lock -->
  <g transform="translate(96, 526) scale(1.08333)" fill="none" stroke="#0E7490" stroke-width="2">
    <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
    <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
    <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
  </g>
    <text x="136" y="546" font-size="17" fill="#18212B"><tspan font-family="Consolas, Microsoft YaHei, Arial, monospace" font-weight="700" fill="#0E7490">may_access</tspan> 是所有读写入口的守门条件；不满足授权即拒绝进入状态迁移。</text>
  </g>

  <g id="case-formula" data-pptx-replace-with="formula"
     data-pptx-x="56" data-pptx-y="584"
     data-pptx-width="1168" data-pptx-height="98"
     data-pptx-bounds="56 584 1168 98">
    <metadata type="application/json"><![CDATA[
      {"latex":"\\begin{aligned}\\mathrm{may\\_access}(p,d)=\\mathrm{true} &\\rightarrow \\mathrm{authorized}(d,p) \\\\ \\mathrm{reassign\\_page}(s,pid,d)=\\mathrm{Ok}(s') &\\rightarrow \\mathrm{page\\_contents}(s',pid)=\\mathrm{zero\\_page}\\end{aligned}","display":"block","font_size":22,"color":"#153A5B","align":"center"}
    ]]></metadata>
    <rect x="56" y="584" width="1168" height="98" fill="#F3F6F8" stroke="#CCD8E2" stroke-width="2"/>
    <text x="640" y="622" text-anchor="middle" font-family="Consolas, Microsoft YaHei, Arial, monospace" font-size="19" fill="#153A5B">may_access(p,d)=true → authorized(d,p)</text>
    <text x="640" y="657" text-anchor="middle" font-family="Consolas, Microsoft YaHei, Arial, monospace" font-size="19" fill="#153A5B">reassign_page(s,pid,d)=Ok(s′) → page_contents(s′,pid)=zero_page</text>
  </g>

  <text id="page-number" data-pptx-role="page-number" x="1224" y="702" text-anchor="end" font-size="16" fill="#153A5B">04</text>
</svg>
