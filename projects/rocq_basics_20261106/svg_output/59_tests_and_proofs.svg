<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Tests check instances; proofs generalize</text></g><g id="tests" data-pptx-bounds="48 108 928 282"><rect x="48" y="108" width="928" height="282" fill="#F5F5F8"/><text x="72" y="146" font-size="20" fill="#262686">CONCRETE TESTS CAN BE PROVED BY COMPUTATION</text><text x="72" y="198" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Example test_bin_incr3 :<tspan x="72" dy="32">  incr (B1 (B1 Z)) = B0 (B0 (B1 Z)).</tspan><tspan x="72" dy="36">Proof. reflexivity. Qed.</tspan><tspan x="72" dy="48">Example test_bin_incr5 :</tspan><tspan x="72" dy="32">  bin_to_nat (incr (B1 Z)) = 1 + bin_to_nat (B1 Z).</tspan><tspan x="72" dy="36">Proof. reflexivity. Qed.</tspan></text></g><g id="general" data-pptx-bounds="48 430 928 146"><text x="52" y="470" font-size="28" fill="#3333B2">The general correctness question remains</text><text x="72" y="526" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">forall b, bin_to_nat (incr b) = 1 + bin_to_nat b</text></g><g id="boundary" data-pptx-bounds="48 616 928 124"><text x="52" y="656">This property quantifies over every binary constructor sequence.<tspan x="52" dy="38">The source returns to its proof later; the tests do not establish it.</tspan></text></g></svg>
