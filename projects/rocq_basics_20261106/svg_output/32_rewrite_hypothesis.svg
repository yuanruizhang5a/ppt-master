<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="code" data-pptx-bounds="48 44 928 338"><rect x="48" y="44" width="928" height="338" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">REWRITE USING AN EQUALITY HYPOTHESIS</text><text x="72" y="132" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem plus_id_example : forall n m : nat,<tspan x="72" dy="34">  n = m -&gt; n + n = m + m.</tspan><tspan x="72" dy="44">Proof.</tspan><tspan x="72" dy="34">  intros n m H.</tspan><tspan x="72" dy="34">  rewrite -&gt; H.</tspan><tspan x="72" dy="34">  reflexivity.</tspan><tspan x="72" dy="34">Qed.</tspan></text></g><g id="states" data-pptx-bounds="48 416 928 182"><text x="52" y="454" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">H : n = m       goal: n + n = m + m<tspan x="52" dy="46">rewrite -&gt; H.         m + m = m + m</tspan><tspan x="52" dy="46">rewrite &lt;- H. would instead yield n + n = n + n.</tspan></text></g><g id="arrows" data-pptx-bounds="48 638 928 104"><text x="52" y="674">In a theorem, -&gt; means implication; in rewrite, it gives direction.<tspan x="52" dy="36">rewrite H defaults to left-to-right replacement.</tspan></text></g></svg>
