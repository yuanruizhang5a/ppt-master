<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Recursive functions: even and odd</text></g>
<g id="code" data-pptx-bounds="48 108 928 350"><rect x="48" y="108" width="928" height="350" fill="#F5F5F8"/><text x="72" y="146" font-size="20" fill="#262686">Fixpoint ENABLES RECURSIVE CALLS</text><text x="72" y="198" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint even (n : nat) : bool :=<tspan x="72" dy="32">  match n with</tspan><tspan x="72" dy="32">  | O =&gt; true</tspan><tspan x="72" dy="32">  | S O =&gt; false</tspan><tspan x="72" dy="32">  | S (S n') =&gt; even n'</tspan><tspan x="72" dy="32">  end.</tspan><tspan x="72" dy="48">Definition odd (n : nat) : bool := negb (even n).</tspan></text></g>
<g id="trace" data-pptx-bounds="48 494 928 110"><rect x="48" y="494" width="928" height="110" fill="#EDF5EF"/><text x="72" y="540" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">even 4 → even 2 → even 0 → true<tspan x="72" dy="38">odd 1 → true                 odd 4 → false</tspan></text></g><g id="rule" data-pptx-bounds="48 644 928 100"><text x="52" y="682">The recursive call uses n', a smaller piece of S (S n').</text></g></svg>
