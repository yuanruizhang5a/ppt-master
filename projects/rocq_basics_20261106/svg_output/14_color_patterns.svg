<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/>
<g id="code" data-pptx-bounds="48 44 928 496"><rect x="48" y="44" width="928" height="496" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">PATTERNS REVEAL THE CONSTRUCTOR AND ITS CONTENTS</text><text x="72" y="130" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition monochrome (c : color) : bool :=<tspan x="72" dy="32">  match c with</tspan><tspan x="72" dy="32">  | black =&gt; true | white =&gt; true</tspan><tspan x="72" dy="32">  | primary p =&gt; false</tspan><tspan x="72" dy="32">  end.</tspan><tspan x="72" dy="46">Definition isred (c : color) : bool :=</tspan><tspan x="72" dy="32">  match c with</tspan><tspan x="72" dy="32">  | black =&gt; false | white =&gt; false</tspan><tspan x="72" dy="32">  | primary red =&gt; true</tspan><tspan x="72" dy="32">  | primary _ =&gt; false</tspan><tspan x="72" dy="32">  end.</tspan></text></g>
<g id="result" data-pptx-bounds="48 568 928 100"><text x="52" y="604" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">isred (primary red)    → true<tspan x="52" dy="38">isred (primary green)  → false</tspan></text></g><g id="rule" data-pptx-bounds="48 682 928 66"><text x="52" y="716" font-size="20">Cases are tried in order; _ ignores a value. Here it catches the remaining rgb cases.</text></g></svg>
