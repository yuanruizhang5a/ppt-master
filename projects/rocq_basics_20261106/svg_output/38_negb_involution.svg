<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="code" data-pptx-bounds="48 44 928 324"><rect x="48" y="44" width="928" height="324" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">CASE ANALYSIS OVER BOOLEANS</text><text x="72" y="134" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem negb_involutive : forall b : bool,<tspan x="72" dy="34">  negb (negb b) = b.</tspan><tspan x="72" dy="42">Proof.</tspan><tspan x="72" dy="34">  intros b. destruct b eqn:E.</tspan><tspan x="72" dy="34">  - reflexivity.</tspan><tspan x="72" dy="34">  - reflexivity.</tspan><tspan x="72" dy="34">Qed.</tspan></text></g><g id="true-case" data-pptx-bounds="48 400 928 114"><text x="52" y="438" font-size="28" fill="#3333B2">Case b = true</text><text x="72" y="490" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">negb (negb true) → negb false → true</text></g><g id="false-case" data-pptx-bounds="48 544 928 114"><text x="52" y="582" font-size="28" fill="#3333B2">Case b = false</text><text x="72" y="634" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">negb (negb false) → negb true → false</text></g><g id="conclusion" data-pptx-bounds="48 694 928 54"><text x="52" y="726" font-size="20">Two cases cover the whole type, so negation is its own inverse.</text></g></svg>
