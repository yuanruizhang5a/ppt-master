<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Functions are values in theorem statements</text></g><g id="identity" data-pptx-bounds="48 106 928 268"><rect x="48" y="106" width="928" height="268" fill="#F5F5F8"/><text x="72" y="144" font-size="20" fill="#262686">WORKED EXERCISE · IDENTITY APPLIED TWICE</text><text x="72" y="194" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem identity_fn_applied_twice :<tspan x="72" dy="32">  forall (f : bool -&gt; bool),</tspan><tspan x="72" dy="32">  (forall x, f x = x) -&gt; forall b, f (f b) = b.</tspan><tspan x="72" dy="40">Proof. intros f H b.</tspan><tspan x="72" dy="32">  rewrite H. rewrite H. reflexivity. Qed.</tspan></text></g><g id="negation" data-pptx-bounds="48 408 928 268"><rect x="48" y="408" width="928" height="268" fill="#F5F5F8"/><text x="72" y="446" font-size="20" fill="#262686">WORKED EXERCISE · NEGATION APPLIED TWICE</text><text x="72" y="496" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem negation_fn_applied_twice :<tspan x="72" dy="32">  forall (f : bool -&gt; bool),</tspan><tspan x="72" dy="32">  (forall x, f x = negb x) -&gt; forall b, f (f b) = b.</tspan><tspan x="72" dy="40">Proof. intros f H b. rewrite H. rewrite H.</tspan><tspan x="72" dy="32">  rewrite negb_involutive. reflexivity. Qed.</tspan></text></g><g id="point" data-pptx-bounds="48 700 928 48"><text x="52" y="730" font-size="20">The hypothesis describes an arbitrary function; rewrite applies it at needed inputs.</text></g></svg>
