<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="code" data-pptx-bounds="48 44 928 304"><rect x="48" y="44" width="928" height="304" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">WORKED SOLUTION · INCREMENT WITH CARRY</text><text x="72" y="134" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint incr (m : bin) : bin :=<tspan x="72" dy="36">  match m with</tspan><tspan x="72" dy="36">  | Z =&gt; B1 Z</tspan><tspan x="72" dy="36">  | B0 n =&gt; B1 n</tspan><tspan x="72" dy="36">  | B1 n =&gt; B0 (incr n)</tspan><tspan x="72" dy="36">  end.</tspan></text></g><g id="trace" data-pptx-bounds="48 390 928 216"><text x="52" y="430" font-size="20" fill="#006B2D">3 → 4 · PROPAGATE CARRY THROUGH TWO B1 CONSTRUCTORS</text><text x="72" y="484" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">incr (B1 (B1 Z))<tspan x="72" dy="38">→ B0 (incr (B1 Z))</tspan><tspan x="72" dy="38">→ B0 (B0 (incr Z))</tspan><tspan x="72" dy="38">→ B0 (B0 (B1 Z))</tspan></text></g><g id="rule" data-pptx-bounds="48 648 928 96"><text x="52" y="688">A low bit 0 becomes 1; a low bit 1 becomes 0 and carries.<tspan x="52" dy="34" font-size="20">Another check: incr (B1 Z) = B0 (B1 Z), representing 1 → 2.</tspan></text></g></svg>
