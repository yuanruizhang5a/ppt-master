<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Compare grades lexicographically</text></g><g id="code" data-pptx-bounds="48 106 928 370"><rect x="48" y="106" width="928" height="370" fill="#F5F5F8"/><text x="72" y="144" font-size="20" fill="#262686">WORKED SOLUTION · COMPARE LETTERS FIRST</text><text x="72" y="194" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition grade_comparison (g1 g2 : grade)<tspan x="72" dy="32">    : comparison :=</tspan><tspan x="72" dy="32">  match g1, g2 with</tspan><tspan x="72" dy="32">  | Grade l1 m1, Grade l2 m2 =&gt;</tspan><tspan x="72" dy="32">      match letter_comparison l1 l2 with</tspan><tspan x="72" dy="32">      | Eq =&gt; modifier_comparison m1 m2</tspan><tspan x="72" dy="32">      | Lt =&gt; Lt | Gt =&gt; Gt</tspan><tspan x="72" dy="32">      end</tspan><tspan x="72" dy="32">  end.</tspan></text></g><g id="results" data-pptx-bounds="48 516 928 132"><text x="52" y="556" fill="#006B2D">A− versus B+ → Gt       A− versus A+ → Lt</text><text x="52" y="604">F+ versus F+ → Eq       B− versus C+ → Gt</text></g><g id="principle" data-pptx-bounds="48 678 928 66"><text x="52" y="716">Only letter ties need modifiers. Avoid enumerating all grade pairs.</text></g></svg>
