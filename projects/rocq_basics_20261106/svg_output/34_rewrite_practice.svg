<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="chain" data-pptx-bounds="48 44 928 278"><rect x="48" y="44" width="928" height="278" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">WORKED EXERCISE · CHAIN TWO EQUALITIES</text><text x="72" y="132" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem plus_id_exercise : forall n m o : nat,<tspan x="72" dy="32">  n = m -&gt; m = o -&gt; n + m = m + o.</tspan><tspan x="72" dy="40">Proof.</tspan><tspan x="72" dy="32">  intros n m o Hnm Hmo.</tspan><tspan x="72" dy="32">  rewrite -&gt; Hnm. rewrite -&gt; Hmo.</tspan><tspan x="72" dy="32">  reflexivity. Qed.</tspan></text></g><g id="mult-one" data-pptx-bounds="48 356 928 276"><rect x="48" y="356" width="928" height="276" fill="#F5F5F8"/><text x="72" y="394" font-size="20" fill="#262686">WORKED EXERCISE · MULTIPLICATION BY ONE</text><text x="72" y="444" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem mult_n_1 : forall p : nat, p * 1 = p.<tspan x="72" dy="40">Proof.</tspan><tspan x="72" dy="32">  intros p. rewrite &lt;- mult_n_Sm.</tspan><tspan x="72" dy="32">  rewrite &lt;- mult_n_O.</tspan><tspan x="72" dy="32">  reflexivity. Qed.</tspan></text></g><g id="goal" data-pptx-bounds="48 666 928 76"><text x="52" y="706" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">p * 1 = p → p * 0 + p = p → 0 + p = p</text></g></svg>
