<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="heading" data-pptx-bounds="48 42 928 94"><text x="52" y="94" font-size="36" fill="#3333B2">One connected mental model</text></g><g id="data" data-pptx-bounds="48 172 928 128"><text x="52" y="212" font-size="28" fill="#3333B2">Constructors → values</text><text x="88" y="262">Inductive declarations say exactly how data is built.</text></g><g id="computation" data-pptx-bounds="48 328 928 128"><text x="52" y="368" font-size="28" fill="#3333B2">Patterns + structural recursion → computation</text><text x="88" y="418">Definitions consume those shapes and calculate results.</text></g><g id="proof" data-pptx-bounds="48 484 928 128"><text x="52" y="524" font-size="28" fill="#3333B2">Propositions + tactics → checked proofs</text><text x="88" y="574">Compute, replace equals, or split on constructors.</text></g><g id="transfer" data-pptx-bounds="48 650 928 94"><text x="52" y="682" font-size="28" fill="#006B2D">The same ideas explain grades and binary numbers,<tspan x="52" dy="42">and establish program properties.</tspan></text></g></svg>
