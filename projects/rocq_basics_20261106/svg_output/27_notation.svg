<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Notation changes syntax, not definitions</text></g><g id="code" data-pptx-bounds="48 108 928 282"><rect x="48" y="108" width="928" height="282" fill="#F5F5F8"/><text x="72" y="146" font-size="20" fill="#262686">PARSER AND PRETTY-PRINTER INSTRUCTIONS</text><text x="72" y="198" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Notation "x + y" := (plus x y)<tspan x="72" dy="32">  (at level 50, left associativity) : nat_scope.</tspan><tspan x="72" dy="46">Notation "x * y" := (mult x y)</tspan><tspan x="72" dy="32">  (at level 40, left associativity) : nat_scope.</tspan><tspan x="72" dy="46">1 + 2 * 3 * 4    parses as    1 + ((2 * 3) * 4)</tspan></text></g><g id="rules" data-pptx-bounds="48 430 928 284"><text x="52" y="470" font-size="28" fill="#3333B2">Precedence, associativity, scope</text><text x="52" y="524">Lower precedence levels bind more tightly (levels range 0–100).<tspan x="52" dy="42">Associativity chooses grouping: left, right, or no associativity.</tspan><tspan x="52" dy="42">Scopes distinguish overloaded symbols: (x * y)%nat.</tspan><tspan x="52" dy="42">0%nat and 0%Z refer to different numeric types.</tspan></text></g></svg>
