<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Destruct exposes the constructors</text></g><g id="code" data-pptx-bounds="48 108 928 304"><rect x="48" y="108" width="928" height="304" fill="#F5F5F8"/><text x="72" y="146" font-size="20" fill="#262686">ONE GOAL BECOMES TWO</text><text x="72" y="196" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem plus_1_neq_0 : forall n : nat,<tspan x="72" dy="32">  (n + 1) =? 0 = false.</tspan><tspan x="72" dy="40">Proof.</tspan><tspan x="72" dy="32">  intros n. destruct n as [| n'] eqn:E.</tspan><tspan x="72" dy="32">  - reflexivity.</tspan><tspan x="72" dy="32">  - reflexivity.</tspan><tspan x="72" dy="32">Qed.</tspan></text></g><g id="cases" data-pptx-bounds="48 448 928 158"><text x="52" y="488" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">Case O:      (0 + 1) =? 0        → false<tspan x="52" dy="44">Case S n':   (S n' + 1) =? 0     → false</tspan><tspan x="52" dy="36">             S (n' + 1) cannot match O.</tspan></text></g><g id="syntax" data-pptx-bounds="48 642 928 104"><text x="52" y="680">[| n'] names no field for O and one field for S.<tspan x="52" dy="36">eqn:E retains the case equation; bullets separate the obligations.</tspan></text></g></svg>
