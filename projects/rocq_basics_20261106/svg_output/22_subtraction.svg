<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/>
<g id="code" data-pptx-bounds="48 44 928 324"><rect x="48" y="44" width="928" height="324" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">SUBTRACTION · MATCH TWO VALUES AT ONCE</text><text x="72" y="134" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint minus (n m : nat) : nat :=<tspan x="72" dy="36">  match n, m with</tspan><tspan x="72" dy="36">  | O, _ =&gt; O</tspan><tspan x="72" dy="36">  | S _, O =&gt; n</tspan><tspan x="72" dy="36">  | S n', S m' =&gt; minus n' m'</tspan><tspan x="72" dy="36">  end.</tspan></text></g><g id="results" data-pptx-bounds="48 414 928 142"><rect x="48" y="414" width="928" height="142" fill="#EDF5EF"/><text x="72" y="458" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">minus 5 2 → minus 4 1 → minus 3 0 → 3<tspan x="72" dy="48">minus 2 5 → minus 1 4 → minus 0 3 → 0</tspan></text></g><g id="boundary" data-pptx-bounds="48 608 928 132"><text x="52" y="648" font-size="28" fill="#3333B2">Natural subtraction saturates at zero</text><text x="52" y="700">There are no negative values in this nat type.</text></g></svg>
