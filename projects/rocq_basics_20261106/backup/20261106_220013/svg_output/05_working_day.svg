<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/>
<g id="code" data-pptx-bounds="48 44 928 466"><rect x="48" y="44" width="928" height="466" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">GALLINA · MATCH EACH CONSTRUCTOR</text><text x="72" y="136" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition next_working_day (d : day) : day :=<tspan x="72" dy="34">  match d with</tspan><tspan x="72" dy="34">  | monday    =&gt; tuesday</tspan><tspan x="72" dy="34">  | tuesday   =&gt; wednesday</tspan><tspan x="72" dy="34">  | wednesday =&gt; thursday</tspan><tspan x="72" dy="34">  | thursday  =&gt; friday</tspan><tspan x="72" dy="34">  | friday    =&gt; monday</tspan><tspan x="72" dy="34">  | saturday  =&gt; monday</tspan><tspan x="72" dy="34">  | sunday    =&gt; monday</tspan><tspan x="72" dy="34">  end.</tspan></text></g>
<g id="results" data-pptx-bounds="48 546 928 144"><rect x="48" y="546" width="928" height="144" fill="#EDF5EF"/><text x="72" y="582" font-size="20" fill="#006B2D">EVALUATION</text><text x="72" y="624" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">next_working_day friday  →  monday<tspan x="72" dy="38">next_working_day (next_working_day saturday)  →  tuesday</tspan></text></g><g id="lesson" data-pptx-bounds="48 706 928 50"><text x="52" y="738" font-size="20">The header declares the input type and result type; the match covers every case.</text></g></svg>
