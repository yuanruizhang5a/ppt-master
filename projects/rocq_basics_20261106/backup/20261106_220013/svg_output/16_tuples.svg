<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Tuples from one constructor</text></g>
<g id="code" data-pptx-bounds="48 106 928 396"><rect x="48" y="106" width="928" height="396" fill="#F5F5F8"/><text x="72" y="144" font-size="20" fill="#262686">INSIDE Module TuplePlayground</text><text x="72" y="194" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Inductive bit : Type := B1 | B0.<tspan x="72" dy="42">Inductive nybble : Type :=</tspan><tspan x="72" dy="32">  | bits (b0 b1 b2 b3 : bit).</tspan><tspan x="72" dy="44">Definition all_zero (nb : nybble) : bool :=</tspan><tspan x="72" dy="32">  match nb with</tspan><tspan x="72" dy="32">  | bits B0 B0 B0 B0 =&gt; true</tspan><tspan x="72" dy="32">  | bits _  _  _  _  =&gt; false</tspan><tspan x="72" dy="32">  end.</tspan></text></g><g id="result" data-pptx-bounds="48 536 928 116"><text x="52" y="578" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">all_zero (bits B1 B0 B1 B0)  → false<tspan x="52" dy="40">all_zero (bits B0 B0 B0 B0)  → true</tspan></text></g><g id="idea" data-pptx-bounds="48 680 928 62"><text x="52" y="714">One constructor wraps four fields; matching unwraps them.</text></g></svg>
