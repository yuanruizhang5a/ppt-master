<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Booleans are another inductive type</text></g>
<g id="code" data-pptx-bounds="48 112 928 360"><rect x="48" y="112" width="928" height="360" fill="#F5F5F8"/><text x="72" y="150" font-size="20" fill="#262686">DATA AND COMPUTATION RULES</text><text x="72" y="204" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Inductive bool : Type := true | false.<tspan x="72" dy="54">Definition negb (b : bool) : bool :=</tspan><tspan x="72" dy="34">  match b with</tspan><tspan x="72" dy="34">  | true  =&gt; false</tspan><tspan x="72" dy="34">  | false =&gt; true</tspan><tspan x="72" dy="34">  end.</tspan></text></g>
<g id="result" data-pptx-bounds="48 510 928 122"><text x="52" y="550" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">Compute (negb true).     (* false : bool *)<tspan x="52" dy="42">Compute (negb false).    (* true : bool *)</tspan></text></g><g id="meaning" data-pptx-bounds="48 660 928 80"><text x="52" y="696">The course rebuilds familiar types to expose their definitions.</text></g></svg>
