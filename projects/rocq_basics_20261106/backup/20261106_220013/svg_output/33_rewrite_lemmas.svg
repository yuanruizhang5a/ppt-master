<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Rewrite using a quantified theorem</text></g><g id="lemmas" data-pptx-bounds="48 104 928 150"><text x="52" y="144" font-size="20" fill="#262686">LIBRARY STATEMENTS · NOTICE THEIR ORIENTATION</text><text x="52" y="190" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">mult_n_O  : forall n, 0 = n * 0<tspan x="52" dy="40">mult_n_Sm : forall n m, n * m + n = n * S m</tspan></text></g><g id="code" data-pptx-bounds="48 286 928 324"><rect x="48" y="286" width="928" height="324" fill="#F5F5F8"/><text x="72" y="324" font-size="20" fill="#262686">ROCQ INFERS THE QUANTIFIED ARGUMENT AT EACH USE</text><text x="72" y="374" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Theorem mult_n_0_m_0 : forall p q : nat,<tspan x="72" dy="32">  p * 0 + q * 0 = 0.</tspan><tspan x="72" dy="40">Proof.</tspan><tspan x="72" dy="32">  intros p q.</tspan><tspan x="72" dy="32">  rewrite &lt;- mult_n_O.</tspan><tspan x="72" dy="32">  rewrite &lt;- mult_n_O.</tspan><tspan x="72" dy="32">  reflexivity.</tspan><tspan x="72" dy="32">Qed.</tspan></text></g><g id="result" data-pptx-bounds="48 648 928 92"><text x="52" y="688">Goal sequence: p * 0 + q * 0 = 0 → 0 + q * 0 = 0 → 0 + 0 = 0.</text></g></svg>
