<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Constructors can carry data</text></g>
<g id="code" data-pptx-bounds="48 110 928 270"><rect x="48" y="110" width="928" height="270" fill="#F5F5F8"/><text x="72" y="148" font-size="20" fill="#262686">BUILD A NEW TYPE FROM AN EXISTING TYPE</text><text x="72" y="202" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Inductive rgb : Type := red | green | blue.<tspan x="72" dy="52">Inductive color : Type :=</tspan><tspan x="72" dy="34">  | black | white | primary (p : rgb).</tspan><tspan x="72" dy="52">Check primary : rgb -&gt; color.</tspan></text></g>
<g id="valid" data-pptx-bounds="48 420 440 176"><text x="52" y="460" font-size="28" fill="#006B2D">Well typed</text><text x="52" y="510" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">red : rgb<tspan x="52" dy="36">primary red : color</tspan><tspan x="52" dy="36">black : color</tspan></text></g><g id="invalid" data-pptx-bounds="530 420 446 176"><text x="534" y="460" font-size="28" fill="#B42318">Ill typed</text><text x="534" y="510" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">true red<tspan x="534" dy="36">red primary</tspan><tspan x="534" dy="36">primary (primary red)</tspan></text></g><g id="rule" data-pptx-bounds="48 650 928 90"><text x="52" y="688">Constructors fix both the number and the types of their arguments.</text></g></svg>
