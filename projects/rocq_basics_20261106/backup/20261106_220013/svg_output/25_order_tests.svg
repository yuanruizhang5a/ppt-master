<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="code" data-pptx-bounds="48 44 928 410"><rect x="48" y="44" width="928" height="410" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">LESS-THAN-OR-EQUAL · THEN STRICT LESS-THAN</text><text x="72" y="132" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint leb (n m : nat) : bool :=<tspan x="72" dy="32">  match n with</tspan><tspan x="72" dy="32">  | O =&gt; true</tspan><tspan x="72" dy="32">  | S n' =&gt; match m with</tspan><tspan x="72" dy="32">            | O =&gt; false</tspan><tspan x="72" dy="32">            | S m' =&gt; leb n' m' end</tspan><tspan x="72" dy="32">  end.</tspan><tspan x="72" dy="48">Definition ltb (n m : nat) : bool := leb (S n) m.</tspan></text></g><g id="results" data-pptx-bounds="48 488 928 128"><text x="52" y="528" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">2 &lt;=? 2 → true    2 &lt;=? 4 → true    4 &lt;=? 2 → false<tspan x="52" dy="44">2 &lt;?  2 → false   2 &lt;?  4 → true    4 &lt;?  2 → false</tspan></text></g><g id="notation" data-pptx-bounds="48 650 928 92"><text x="52" y="686">The notations &lt;=? and &lt;? stand for leb and ltb.<tspan x="52" dy="34" font-size="20">ltb is a worked exercise solution: reuse leb rather than invent recursion.</tspan></text></g></svg>
