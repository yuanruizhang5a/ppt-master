<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Modules keep names separate</text></g>
<g id="code" data-pptx-bounds="48 112 928 344"><rect x="48" y="112" width="928" height="344" fill="#F5F5F8"/><text x="72" y="150" font-size="20" fill="#262686">TWO DEFINITIONS CALLED foo</text><text x="72" y="204" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Module Playground.<tspan x="72" dy="34">  Definition foo : rgb := blue.</tspan><tspan x="72" dy="34">End Playground.</tspan><tspan x="72" dy="54">Definition foo : bool := true.</tspan><tspan x="72" dy="54">Check Playground.foo : rgb.</tspan><tspan x="72" dy="34">Check foo : bool.</tspan></text></g><g id="results" data-pptx-bounds="48 500 928 112"><text x="52" y="540" fill="#006B2D">Playground.foo names the value blue.</text><text x="52" y="588">The later unqualified foo names the value true.</text></g><g id="purpose" data-pptx-bounds="48 650 928 90"><text x="52" y="690">We use modules to experiment without colliding with library definitions.</text></g></svg>
