<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Why structural recursion matters</text></g><g id="code" data-pptx-bounds="48 110 928 264"><rect x="48" y="110" width="928" height="264" fill="#F5F5F8"/><text x="72" y="148" font-size="20" fill="#262686">ACCEPTED: THE RECURSIVE ARGUMENT IS A SUBTERM</text><text x="72" y="200" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint plus' (n m : nat) : nat :=<tspan x="72" dy="34">  match n with</tspan><tspan x="72" dy="34">  | O =&gt; m</tspan><tspan x="72" dy="34">  | S n' =&gt; S (plus' n' m)</tspan><tspan x="72" dy="34">  end.</tspan></text></g><g id="rule" data-pptx-bounds="48 408 928 140"><text x="52" y="448">Rocq checks that some argument decreases structurally.<tspan x="52" dy="38">Here n' is obtained by taking apart S n'.</tspan><tspan x="52" dy="38">This ensures recursive evaluation eventually reaches a base case.</tspan></text></g><g id="limit" data-pptx-bounds="48 586 928 148"><rect x="48" y="586" width="928" height="148" fill="#F5F5F8"/><text x="72" y="628" font-size="28" fill="#B42318">Termination is not enough for this checker</text><text x="72" y="678">A terminating algorithm may still be rejected if its decrease<tspan x="72" dy="34">is not recognizable as structural. Optional exercise: find one.</tspan></text></g></svg>
