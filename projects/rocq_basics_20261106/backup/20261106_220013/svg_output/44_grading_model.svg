<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Model a course grading policy</text></g><g id="code" data-pptx-bounds="48 110 928 342"><rect x="48" y="110" width="928" height="342" fill="#F5F5F8"/><text x="72" y="148" font-size="20" fill="#262686">INSIDE Module LateDays</text><text x="72" y="200" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Inductive letter : Type := A | B | C | D | F.<tspan x="72" dy="48">Inductive modifier : Type := Plus | Natural | Minus.</tspan><tspan x="72" dy="48">Inductive grade : Type :=</tspan><tspan x="72" dy="32">  | Grade (l : letter) (m : modifier).</tspan><tspan x="72" dy="48">Inductive comparison : Type := Eq | Lt | Gt.</tspan></text></g><g id="examples" data-pptx-bounds="48 494 928 112"><text x="52" y="534" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">Grade A Minus    represents A−<tspan x="52" dy="42">Grade C Natural  represents C</tspan></text></g><g id="purpose" data-pptx-bounds="48 646 928 100"><text x="52" y="684">We can compute decisions and prove policy properties in one model.<tspan x="52" dy="34" font-size="20">This is the chapter's example policy, not a statement of this course's actual rules.</tspan></text></g></svg>
