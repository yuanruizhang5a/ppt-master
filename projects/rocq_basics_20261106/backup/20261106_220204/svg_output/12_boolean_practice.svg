<g id="specification" data-pptx-bounds="48 108 928 158"><text x="52" y="148" font-size="28" fill="#3333B2">Write the specification before the code</text><text x="52" y="196">nandb: true when at least one input is false.<tspan x="52" dy="38">andb3: true only when all three inputs are true.</tspan></text></g>
<g id="code" data-pptx-bounds="48 300 928 230"><rect x="48" y="300" width="928" height="230" fill="#F5F5F8"/><text x="72" y="338" font-size="20" fill="#262686">WORKED IMPLEMENTATIONS · TRY YOUR OWN FIRST</text><text x="72" y="392" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition nandb (b1 b2 : bool) : bool :=<tspan x="72" dy="34">  negb (andb b1 b2).</tspan><tspan x="72" dy="48">Definition andb3 (b1 b2 b3 : bool) : bool :=</tspan><tspan x="72" dy="34">  andb (andb b1 b2) b3.</tspan></text></g>
