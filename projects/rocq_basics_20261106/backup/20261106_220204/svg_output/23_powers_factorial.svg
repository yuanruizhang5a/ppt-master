<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Recursion practice: powers and factorial</text></g><g id="code" data-pptx-bounds="48 106 928 450"><rect x="48" y="106" width="928" height="450" fill="#F5F5F8"/><text x="72" y="144" font-size="20" fill="#262686">SOURCE exp · WORKED SOLUTION factorial</text><text x="72" y="194" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint exp (base power : nat) : nat :=<tspan x="72" dy="32">  match power with</tspan><tspan x="72" dy="32">  | O =&gt; 1</tspan><tspan x="72" dy="32">  | S p =&gt; mult base (exp base p)</tspan><tspan x="72" dy="32">  end.</tspan><tspan x="72" dy="46">Fixpoint factorial (n : nat) : nat :=</tspan><tspan x="72" dy="32">  match n with</tspan><tspan x="72" dy="32">  | O =&gt; 1</tspan><tspan x="72" dy="32">  | S n' =&gt; mult n (factorial n')</tspan><tspan x="72" dy="32">  end.</tspan></text></g><g id="result" data-pptx-bounds="48 594 928 100"><text x="52" y="634" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">exp 2 3 → 8    factorial 3 → 6    factorial 5 → 120</text><text x="52" y="680">Base case: 0! = 1.  Recursive step: n! = n × (n−1)!.</text></g></svg>
