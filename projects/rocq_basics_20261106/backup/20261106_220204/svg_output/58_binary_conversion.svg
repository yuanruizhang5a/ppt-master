<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="code" data-pptx-bounds="48 44 928 308"><rect x="48" y="44" width="928" height="308" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">WORKED SOLUTION · INTERPRET THE CONSTRUCTOR SEQUENCE</text><text x="72" y="134" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint bin_to_nat (m : bin) : nat :=<tspan x="72" dy="36">  match m with</tspan><tspan x="72" dy="36">  | Z =&gt; 0</tspan><tspan x="72" dy="36">  | B0 n =&gt; 2 * bin_to_nat n</tspan><tspan x="72" dy="36">  | B1 n =&gt; 1 + 2 * bin_to_nat n</tspan><tspan x="72" dy="36">  end.</tspan></text></g><g id="trace" data-pptx-bounds="48 392 928 180"><text x="52" y="432" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">bin_to_nat (B0 (B1 Z))<tspan x="52" dy="40">→ 2 * (1 + 2 * 0)</tspan><tspan x="52" dy="40">→ 2</tspan></text></g><g id="results" data-pptx-bounds="48 612 928 130"><rect x="48" y="612" width="928" height="130" fill="#EDF5EF"/><text x="72" y="654" font-size="20" fill="#006B2D">MORE EVALUATIONS</text><text x="72" y="704" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">bin_to_nat (B0 (B0 (B0 (B1 Z)))) = 8</text></g></svg>
