<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">Natural numbers: zero and successor</text></g>
<g id="code" data-pptx-bounds="48 112 928 210"><rect x="48" y="112" width="928" height="210" fill="#F5F5F8"/><text x="72" y="150" font-size="20" fill="#262686">INSIDE Module NatPlayground</text><text x="72" y="206" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Inductive nat : Type :=<tspan x="72" dy="36">  | O</tspan><tspan x="72" dy="36">  | S (n : nat).</tspan></text></g>
<g id="representation" data-pptx-bounds="48 362 928 178"><text x="52" y="402" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">O             represents 0<tspan x="52" dy="42">S O           represents 1</tspan><tspan x="52" dy="42">S (S (S O))   represents 3</tspan></text></g><g id="meaning" data-pptx-bounds="48 570 928 170"><text x="52" y="610">Two constructors generate an infinite set of finite values.<tspan x="52" dy="38">O is the letter O; ordinary decimal 0 is notation.</tspan><tspan x="52" dy="38">The names are arbitrary: how we use the marks gives them meaning.</tspan></text></g></svg>
