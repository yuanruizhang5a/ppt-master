<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="code" data-pptx-bounds="48 36 928 568"><rect x="48" y="36" width="928" height="568" fill="#F5F5F8"/><text x="72" y="74" font-size="20" fill="#262686">COMPARE LETTERS · A &gt; B &gt; C &gt; D &gt; F</text><text x="72" y="122" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition letter_comparison (l1 l2 : letter)<tspan x="72" dy="28">    : comparison :=</tspan><tspan x="72" dy="28">  match l1, l2 with</tspan><tspan x="72" dy="28">  | A, A =&gt; Eq</tspan><tspan x="72" dy="28">  | A, _ =&gt; Gt</tspan><tspan x="72" dy="28">  | B, A =&gt; Lt</tspan><tspan x="72" dy="28">  | B, B =&gt; Eq</tspan><tspan x="72" dy="28">  | B, _ =&gt; Gt</tspan><tspan x="72" dy="28">  | C, (A | B) =&gt; Lt</tspan><tspan x="72" dy="28">  | C, C =&gt; Eq</tspan><tspan x="72" dy="28">  | C, _ =&gt; Gt</tspan><tspan x="72" dy="28">  | D, (A | B | C) =&gt; Lt</tspan><tspan x="72" dy="28">  | D, D =&gt; Eq</tspan><tspan x="72" dy="28">  | D, _ =&gt; Gt</tspan><tspan x="72" dy="28">  | F, (A | B | C | D) =&gt; Lt</tspan><tspan x="72" dy="28">  | F, F =&gt; Eq</tspan><tspan x="72" dy="28">  end.</tspan></text></g><g id="results" data-pptx-bounds="48 628 928 114"><text x="52" y="664">B versus A → Lt; D versus D → Eq; B versus F → Gt.</text><text x="52" y="706" font-size="20">modifier_comparison uses the same pattern, ordered Plus &gt; Natural &gt; Minus.</text></g></svg>
