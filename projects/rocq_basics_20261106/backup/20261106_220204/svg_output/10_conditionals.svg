<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/>
<g id="code" data-pptx-bounds="48 44 928 408"><rect x="48" y="44" width="928" height="408" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">CONDITIONALS INSPECT TWO-CONSTRUCTOR TYPES</text><text x="72" y="134" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition negb' (b : bool) : bool :=<tspan x="72" dy="34">  if b then false else true.</tspan><tspan x="72" dy="54">Inductive bw : Type := bw_black | bw_white.</tspan><tspan x="72" dy="54">Definition invert (x : bw) : bw :=</tspan><tspan x="72" dy="34">  if x then bw_white else bw_black.</tspan><tspan x="72" dy="54">Compute (invert bw_black).</tspan><tspan x="72" dy="34">Compute (invert bw_white).</tspan></text></g>
<g id="result" data-pptx-bounds="48 486 928 100"><rect x="48" y="486" width="928" height="100" fill="#EDF5EF"/><text x="72" y="528" fill="#006B2D">bw_white : bw</text><text x="72" y="568" fill="#006B2D">bw_black : bw</text></g><g id="rule" data-pptx-bounds="48 622 928 120"><text x="52" y="658">The first constructor selects then; the second selects else.<tspan x="52" dy="38">The constructor names need not be true and false.</tspan></text></g></svg>
