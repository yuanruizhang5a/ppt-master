<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="code" data-pptx-bounds="48 44 928 398"><rect x="48" y="44" width="928" height="398" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">IMPLEMENT THE THRESHOLDS WITH BOOLEAN GUARDS</text><text x="72" y="134" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition apply_late_policy<tspan x="72" dy="34">    (late_days : nat) (g : grade) : grade :=</tspan><tspan x="72" dy="34">  if late_days &lt;? 9 then g</tspan><tspan x="72" dy="34">  else if late_days &lt;? 17 then lower_grade g</tspan><tspan x="72" dy="34">  else if late_days &lt;? 21 then</tspan><tspan x="72" dy="34">    lower_grade (lower_grade g)</tspan><tspan x="72" dy="34">  else</tspan><tspan x="72" dy="34">    lower_grade (lower_grade (lower_grade g)).</tspan></text></g><g id="results" data-pptx-bounds="48 482 928 180"><rect x="48" y="482" width="928" height="180" fill="#EDF5EF"/><text x="72" y="522" font-size="20" fill="#006B2D">CHECKED RESULTS · g = Grade A Plus</text><text x="72" y="574" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">days 8 → A+     days 9 → A      days 16 → A<tspan x="72" dy="46">days 17 → A−    days 20 → A−    days 21 → B+</tspan></text></g><g id="meaning" data-pptx-bounds="48 694 928 50"><text x="52" y="726" font-size="20">Each false guard rules out earlier bands; evaluation picks exactly one branch.</text></g></svg>
