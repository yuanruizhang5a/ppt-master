<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/>
<g id="code" data-pptx-bounds="48 44 928 280"><rect x="48" y="44" width="928" height="280" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">ADDITION · RECURSE ON THE FIRST ARGUMENT</text><text x="72" y="134" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Fixpoint plus (n m : nat) : nat :=<tspan x="72" dy="34">  match n with</tspan><tspan x="72" dy="34">  | O =&gt; m</tspan><tspan x="72" dy="34">  | S n' =&gt; S (plus n' m)</tspan><tspan x="72" dy="34">  end.</tspan></text></g>
<g id="trace" data-pptx-bounds="48 366 928 276"><text x="52" y="402" font-size="20" fill="#006B2D">REDUCTION TRACE · Compute (plus 3 2).</text><text x="72" y="456" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">plus 3 2<tspan x="72" dy="36">→ S (plus 2 2)</tspan><tspan x="72" dy="36">→ S (S (plus 1 2))</tspan><tspan x="72" dy="36">→ S (S (S (plus 0 2)))</tspan><tspan x="72" dy="36">→ S (S (S 2))  =  5</tspan></text></g><g id="point" data-pptx-bounds="48 678 928 64"><text x="52" y="716">Which branch can run depends on the constructor at the front of n.</text></g></svg>
