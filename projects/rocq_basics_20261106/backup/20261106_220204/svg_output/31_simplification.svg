<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2"/><text x="32" y="44" font-size="36" fill="#FFFFFF">What simplification can establish</text></g><g id="reduces" data-pptx-bounds="48 120 928 170"><text x="52" y="160" font-size="28" fill="#006B2D">0 + n reduces even when n is unknown</text><text x="52" y="212">plus matches its first argument, which is already O.</text><text x="72" y="262" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">plus O n  →  n</text></g><g id="blocked" data-pptx-bounds="48 330 928 152"><text x="52" y="370" font-size="28" fill="#B42318">n + 0 is blocked when n is unknown</text><text x="52" y="422">The match cannot choose O or S n' yet.<tspan x="52" dy="36">Mathematical truth alone does not make a term reduce.</tspan></text></g><g id="code" data-pptx-bounds="48 526 928 206"><rect x="48" y="526" width="928" height="206" fill="#F5F5F8"/><text x="72" y="568" font-size="20" fill="#262686">A SHORTER CHECKED PROOF</text><text x="72" y="618" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">Proof. intros n. reflexivity. Qed.</text><text x="72" y="668">reflexivity computes and unfolds when checking equality.<tspan x="72" dy="34">simpl is useful for displaying an understandable intermediate goal.</tspan></text></g></svg>
