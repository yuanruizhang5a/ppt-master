<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF"/>
<g id="code" data-pptx-bounds="48 44 928 398"><rect x="48" y="44" width="928" height="398" fill="#F5F5F8"/><text x="72" y="82" font-size="20" fill="#262686">CONSTRUCTING DATA IS DIFFERENT FROM COMPUTING</text><text x="72" y="132" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve">Definition pred (n : nat) : nat :=<tspan x="72" dy="32">  match n with O =&gt; O | S n' =&gt; n' end.</tspan><tspan x="72" dy="50">Definition minustwo (n : nat) : nat :=</tspan><tspan x="72" dy="32">  match n with</tspan><tspan x="72" dy="32">  | O =&gt; O</tspan><tspan x="72" dy="32">  | S O =&gt; O</tspan><tspan x="72" dy="32">  | S (S n') =&gt; n'</tspan><tspan x="72" dy="32">  end.</tspan></text></g>
<g id="results" data-pptx-bounds="48 476 928 100"><text x="52" y="514" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">pred 0 → 0     pred 3 → 2     minustwo 4 → 2<tspan x="52" dy="40">Check S : nat -&gt; nat.   (* same type as pred *)</tspan></text></g><g id="distinction" data-pptx-bounds="48 614 928 130"><text x="52" y="652">S stores a successor shape; it does not reduce by a function rule.<tspan x="52" dy="38">pred and minustwo have computation rules that inspect that shape.</tspan></text></g></svg>
