<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Qed, Admitted, and Abort</text></g><g id="qed" data-pptx-bounds="48 116 928 148"><text x="52" y="156" font-size="28" fill="#006B2D">Qed. — finish a checked proof</text><text x="52" y="208">Every remaining goal must already be solved.</text><text x="52" y="244">The named theorem is now available to later proofs.</text></g><g id="admitted" data-pptx-bounds="48 306 928 172"><text x="52" y="346" font-size="28" fill="#B42318">Admitted. — accept an unproved statement</text><text x="52" y="398">Useful as a temporary development placeholder.</text><text x="52" y="434">Later proofs may depend on it, so acceptance is not full assurance.</text><text x="52" y="470">Track assumptions and return to discharge them.</text></g><g id="abort" data-pptx-bounds="48 520 928 134"><text x="52" y="560" font-size="28" fill="#3333B2">Abort. — abandon the current declaration</text><text x="52" y="612">The attempted theorem is not added to the environment.</text></g><g id="homework" data-pptx-bounds="48 682 928 66"><text x="52" y="718" font-size="20">Homework: preserve unfinished exercises with Admitted, not Abort.</text></g></svg>