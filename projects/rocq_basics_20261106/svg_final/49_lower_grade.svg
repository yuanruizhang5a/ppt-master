<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 44 928 432"><rect x="48" y="44" width="928" height="432" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">WORKED SOLUTION · LOWER A GRADE ONE STEP</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="134">Definition lower_grade (g : grade) : grade :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="168">  match g with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="202">  | Grade l Plus =&gt; Grade l Natural</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="236">  | Grade l Natural =&gt; Grade l Minus</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="270">  | Grade l Minus =&gt;</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="304">      match l with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="338">      | F =&gt; Grade F Minus</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="372">      | _ =&gt; Grade (lower_letter l) Plus</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="406">      end</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="440">  end.</text></g><g id="sequence" data-pptx-bounds="48 516 928 132"><text x="52" y="558" font-size="28" fill="#3333B2">A+ → A → A− → B+ → B → B− → C+ → …</text><text x="52" y="610">At the bottom: F+ → F → F− → F−.</text></g><g id="boundary" data-pptx-bounds="48 680 928 64"><text x="52" y="716">Handle the modifier first; inspect the letter only for rollover.</text></g></svg>