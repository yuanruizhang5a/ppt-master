<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Destruct exposes the constructors</text></g><g id="code" data-pptx-bounds="48 108 928 304"><rect x="48" y="108" width="928" height="304" fill="#F5F5F8" /><text x="72" y="146" font-size="20" fill="#262686">ONE GOAL BECOMES TWO</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="196">Theorem plus_1_neq_0 : forall n : nat,</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="228">  (n + 1) =? 0 = false.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="268">Proof.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="300">  intros n. destruct n as [| n'] eqn:E.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="332">  - reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="364">  - reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="396">Qed.</text></g><g id="cases" data-pptx-bounds="48 448 928 158"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="488">Case O:      (0 + 1) =? 0        → false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="532">Case S n':   (S n' + 1) =? 0     → false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="568">             S (n' + 1) cannot match O.</text></g><g id="syntax" data-pptx-bounds="48 642 928 104"><text x="52" y="680">[| n'] names no field for O and one field for S.</text><text x="52" y="716">eqn:E retains the case equation; bullets separate the obligations.</text></g></svg>