<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 44 928 422"><rect x="48" y="44" width="928" height="422" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">WORKED EXERCISE · SELECT THE 9–16 DAY BAND</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="132">Theorem grade_lowered_once :</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="164">  forall (late_days : nat) (g : grade),</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="196">  (late_days &lt;? 9 = false) -&gt;</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="228">  (late_days &lt;? 17 = true) -&gt;</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="260">  apply_late_policy late_days g = lower_grade g.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="300">Proof.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="332">  intros late_days g H9 H17.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="364">  rewrite apply_late_policy_unfold.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="396">  rewrite H9. rewrite H17. reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="428">Qed.</text></g><g id="states" data-pptx-bounds="48 504 928 134"><text x="52" y="544">H9 selects the outer else branch.</text><text x="52" y="584">H17 selects the next then branch.</text><text x="52" y="624">The remaining goal is lower_grade g = lower_grade g.</text></g><g id="transfer" data-pptx-bounds="48 678 928 66"><text x="52" y="716" font-size="20">Practice: formulate the boolean hypotheses for the two-step and three-step bands.</text></g></svg>