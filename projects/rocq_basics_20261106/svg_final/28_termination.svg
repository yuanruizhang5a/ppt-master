<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Why structural recursion matters</text></g><g id="code" data-pptx-bounds="48 110 928 264"><rect x="48" y="110" width="928" height="264" fill="#F5F5F8" /><text x="72" y="148" font-size="20" fill="#262686">ACCEPTED: THE RECURSIVE ARGUMENT IS A SUBTERM</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="200">Fixpoint plus' (n m : nat) : nat :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="234">  match n with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="268">  | O =&gt; m</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="302">  | S n' =&gt; S (plus' n' m)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="336">  end.</text></g><g id="rule" data-pptx-bounds="48 408 928 140"><text x="52" y="448">Rocq checks that some argument decreases structurally.</text><text x="52" y="486">Here n' is obtained by taking apart S n'.</text><text x="52" y="524">This ensures recursive evaluation eventually reaches a base case.</text></g><g id="limit" data-pptx-bounds="48 586 928 148"><rect x="48" y="586" width="928" height="148" fill="#F5F5F8" /><text x="72" y="628" font-size="28" fill="#B42318">Termination is not enough for this checker</text><text x="72" y="678">A terminating algorithm may still be rejected if its decrease</text><text x="72" y="712">is not recognizable as structural. Optional exercise: find one.</text></g></svg>