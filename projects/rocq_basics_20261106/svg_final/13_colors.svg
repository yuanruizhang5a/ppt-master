<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Constructors can carry data</text></g>
<g id="code" data-pptx-bounds="48 110 928 270"><rect x="48" y="110" width="928" height="270" fill="#F5F5F8" /><text x="72" y="148" font-size="20" fill="#262686">BUILD A NEW TYPE FROM AN EXISTING TYPE</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="202">Inductive rgb : Type := red | green | blue.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="254">Inductive color : Type :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="288">  | black | white | primary (p : rgb).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="340">Check primary : rgb -&gt; color.</text></g>
<g id="valid" data-pptx-bounds="48 420 440 176"><text x="52" y="460" font-size="28" fill="#006B2D">Well typed</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="510">red : rgb</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="546">primary red : color</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="582">black : color</text></g><g id="invalid" data-pptx-bounds="530 420 446 176"><text x="534" y="460" font-size="28" fill="#B42318">Ill typed</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="534" y="510">true red</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="534" y="546">red primary</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="534" y="582">primary (primary red)</text></g><g id="rule" data-pptx-bounds="48 650 928 90"><text x="52" y="688">Constructors fix both the number and the types of their arguments.</text></g></svg>