<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 44 928 304"><rect x="48" y="44" width="928" height="304" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">WORKED SOLUTION · INCREMENT WITH CARRY</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="134">Fixpoint incr (m : bin) : bin :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="170">  match m with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="206">  | Z =&gt; B1 Z</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="242">  | B0 n =&gt; B1 n</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="278">  | B1 n =&gt; B0 (incr n)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="314">  end.</text></g><g id="trace" data-pptx-bounds="48 390 928 216"><text x="52" y="430" font-size="20" fill="#006B2D">3 → 4 · PROPAGATE CARRY THROUGH TWO B1 CONSTRUCTORS</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="484">incr (B1 (B1 Z))</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="522">→ B0 (incr (B1 Z))</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="560">→ B0 (B0 (incr Z))</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="598">→ B0 (B0 (B1 Z))</text></g><g id="rule" data-pptx-bounds="48 648 928 96"><text x="52" y="688">A low bit 0 becomes 1; a low bit 1 becomes 0 and carries.</text><text x="52" y="722" font-size="20">Another check: incr (B1 Z) = B0 (B1 Z), representing 1 → 2.</text></g></svg>