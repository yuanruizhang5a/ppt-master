<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Choose a proof tactic deliberately</text></g><g id="guide" data-pptx-bounds="48 108 928 278"><text x="52" y="148">Quantifier or premise in the goal?  →  intros</text><text x="52" y="200">Known constructors permit computation?  →  simpl</text><text x="52" y="252">Sides equal after computation?  →  reflexivity</text><text x="52" y="304">An equality connects the expressions?  →  rewrite</text><text x="52" y="356">An unknown constructor blocks progress?  →  destruct</text></g><g id="practice" data-pptx-bounds="48 416 928 196"><rect x="48" y="416" width="928" height="196" fill="#F5F5F8" /><text x="72" y="454" font-size="20" fill="#262686">PRACTICE · SELECT THE FIRST USEFUL STEP</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="504">forall n, 0 =? (n + 1) = false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="552">forall b c, andb b c = orb b c -&gt; b = c</text><text x="72" y="588" font-size="20">The second exercise is optional: simplify useful cases before splitting again.</text></g><g id="limit" data-pptx-bounds="48 648 928 100"><text x="52" y="688">destruct provides cases, but no induction hypothesis.</text><text x="52" y="722" font-size="20">A recursive datatype does not automatically make every proof a case-only proof.</text></g></svg>