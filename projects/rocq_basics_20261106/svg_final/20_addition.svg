<g id="code" data-pptx-bounds="48 44 928 280"><rect x="48" y="44" width="928" height="280" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">ADDITION · RECURSE ON THE FIRST ARGUMENT</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="134">Fixpoint plus (n m : nat) : nat :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="168">  match n with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="202">  | O =&gt; m</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="236">  | S n' =&gt; S (plus n' m)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="270">  end.</text></g>
<g id="trace" data-pptx-bounds="48 366 928 276"><text x="52" y="402" font-size="20" fill="#006B2D">REDUCTION TRACE · Compute (plus 3 2).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="456">plus 3 2</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="492">→ S (plus 2 2)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="528">→ S (S (plus 1 2))</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="564">→ S (S (S (plus 0 2)))</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="600">→ S (S (S 2))  =  5</text></g><g id="point" data-pptx-bounds="48 678 928 64"><text x="52" y="716">Which branch can run depends on the constructor at the front of n.</text></g></svg>