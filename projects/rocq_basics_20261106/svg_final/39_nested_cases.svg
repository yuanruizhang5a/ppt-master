<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 44 928 508"><rect x="48" y="44" width="928" height="508" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">NESTED CASES · COMMUTATIVITY OF andb</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="132">Theorem andb_commutative : forall b c,</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="164">  andb b c = andb c b.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="204">Proof.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="236">  intros b c. destruct b eqn:Eb.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="268">  - destruct c eqn:Ec.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="300">    + reflexivity.    (* true, true *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="332">    + reflexivity.    (* true, false *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="364">  - destruct c eqn:Ec.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="396">    + reflexivity.    (* false, true *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="428">    + reflexivity.    (* false, false *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="460">Qed.</text></g><g id="meaning" data-pptx-bounds="48 590 928 144"><text x="52" y="630">Each branch checks one row of the full two-input truth table.</text><text x="52" y="670">The outer - bullets handle b; the inner + bullets handle c.</text><text x="52" y="710">Finish one goal before moving to the next bullet.</text></g></svg>