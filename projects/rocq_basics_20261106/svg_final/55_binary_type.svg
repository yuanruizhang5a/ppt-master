<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Binary numbers use a recursive datatype</text></g><g id="code" data-pptx-bounds="48 112 928 256"><rect x="48" y="112" width="928" height="256" fill="#F5F5F8" /><text x="72" y="150" font-size="20" fill="#262686">THREE CONSTRUCTORS · A DIFFERENT REPRESENTATION</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="206">Inductive bin : Type :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="242">  | Z</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="278">  | B0 (n : bin)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="314">  | B1 (n : bin).</text></g><g id="interpretation" data-pptx-bounds="48 410 928 176"><text x="52" y="450">Z represents zero.</text><text x="52" y="502">B0 n represents twice the value of n.</text><text x="52" y="554">B1 n represents twice the value of n, plus one.</text></g><g id="comparison" data-pptx-bounds="48 626 928 116"><text x="52" y="666">Unary values chain S constructors; binary values chain bits.</text><text x="52" y="702" font-size="20">These B0/B1 take an argument; the earlier tuple bits had no arguments.</text></g></svg>