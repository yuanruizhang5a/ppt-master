<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 36 928 568"><rect x="48" y="36" width="928" height="568" fill="#F5F5F8" /><text x="72" y="74" font-size="20" fill="#262686">COMPARE LETTERS · A &gt; B &gt; C &gt; D &gt; F</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="122">Definition letter_comparison (l1 l2 : letter)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="150">    : comparison :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="178">  match l1, l2 with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="206">  | A, A =&gt; Eq</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="234">  | A, _ =&gt; Gt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="262">  | B, A =&gt; Lt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="290">  | B, B =&gt; Eq</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="318">  | B, _ =&gt; Gt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="346">  | C, (A | B) =&gt; Lt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="374">  | C, C =&gt; Eq</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="402">  | C, _ =&gt; Gt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="430">  | D, (A | B | C) =&gt; Lt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="458">  | D, D =&gt; Eq</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="486">  | D, _ =&gt; Gt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="514">  | F, (A | B | C | D) =&gt; Lt</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="542">  | F, F =&gt; Eq</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="570">  end.</text></g><g id="results" data-pptx-bounds="48 628 928 114"><text x="52" y="664">B versus A → Lt; D versus D → Eq; B versus F → Gt.</text><text x="52" y="706" font-size="20">modifier_comparison uses the same pattern, ordered Plus &gt; Natural &gt; Minus.</text></g></svg>