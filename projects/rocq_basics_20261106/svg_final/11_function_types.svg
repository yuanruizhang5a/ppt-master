<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Read function types</text></g>
<g id="code" data-pptx-bounds="48 112 928 264"><rect x="48" y="112" width="928" height="264" fill="#F5F5F8" /><text x="72" y="150" font-size="20" fill="#262686">CHECK AN EXPRESSION OR VERIFY ITS EXPECTED TYPE</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="206">Check true : bool.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="248">Check (negb true) : bool.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="290">Check negb : bool -&gt; bool.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="332">Check andb : bool -&gt; bool -&gt; bool.</text></g>
<g id="meaning" data-pptx-bounds="48 420 928 188"><text x="52" y="460" font-size="28" fill="#3333B2">Every expression has a type—including a function</text><text x="52" y="516">negb takes one boolean and produces a boolean.</text><text x="52" y="556">andb takes two booleans, one at a time, and produces a boolean.</text></g><g id="inference" data-pptx-bounds="48 634 928 110"><text x="52" y="672">Rocq can infer many omitted types.</text><text x="52" y="708">We write them explicitly to make definitions easier to read.</text></g></svg>