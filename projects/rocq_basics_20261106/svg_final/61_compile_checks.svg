<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Compile and run the chapter checks</text></g><g id="commands" data-pptx-bounds="48 108 928 286"><rect x="48" y="108" width="928" height="286" fill="#F5F5F8" /><text x="72" y="146" font-size="20" fill="#262686">TERMINAL · SAVE Basics.v FIRST · RUN IN THE LF DIRECTORY</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="202">rocq compile -Q . LF Basics.v</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="246">rocq compile -Q . LF BasicsTest.v</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="306"># Alternative with the supplied build setup:</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="342">make BasicsTest.vo</text></g><g id="configuration" data-pptx-bounds="48 434 928 144"><text x="52" y="474">The _CoqProject file should contain -Q . LF.</text><text x="52" y="526">Basics.v exports String for the course tooling:</text><text x="72" y="566" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">From Stdlib Require Export String.</text></g><g id="expected" data-pptx-bounds="48 618 928 124"><text x="52" y="658">Check missing exercises, statement types, and assumptions.</text><text x="52" y="696">Running it is optional; it is a useful check before submission.</text></g></svg>