<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" />
<g id="code" data-pptx-bounds="48 44 928 466"><rect x="48" y="44" width="928" height="466" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">GALLINA · MATCH EACH CONSTRUCTOR</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="136">Definition next_working_day (d : day) : day :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="170">  match d with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="204">  | monday    =&gt; tuesday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="238">  | tuesday   =&gt; wednesday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="272">  | wednesday =&gt; thursday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="306">  | thursday  =&gt; friday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="340">  | friday    =&gt; monday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="374">  | saturday  =&gt; monday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="408">  | sunday    =&gt; monday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="442">  end.</text></g>
<g id="results" data-pptx-bounds="48 546 928 144"><rect x="48" y="546" width="928" height="144" fill="#EDF5EF" /><text x="72" y="582" font-size="20" fill="#006B2D">EVALUATION</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="624">next_working_day friday  →  monday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="662">next_working_day (next_working_day saturday)  →  tuesday</text></g><g id="lesson" data-pptx-bounds="48 706 928 50"><text x="52" y="738" font-size="20">The header declares the input type and result type; the match covers every case.</text></g></svg>