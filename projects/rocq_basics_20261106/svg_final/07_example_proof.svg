<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" />
<g id="code" data-pptx-bounds="48 44 928 256"><rect x="48" y="44" width="928" height="256" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">A NAMED CLAIM AND ITS PROOF</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="134">Example test_next_working_day :</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="168">  next_working_day (next_working_day saturday)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="202">  = tuesday.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="246">Proof. simpl. reflexivity. Qed.</text></g>
<g id="state" data-pptx-bounds="48 334 928 132"><rect x="48" y="334" width="928" height="132" fill="#EDF5EF" /><text x="72" y="376" fill="#006B2D">simpl: both sides reduce to tuesday.</text><text x="72" y="424">reflexivity: the two sides are equal; no goals remain.</text></g>
<g id="extraction" data-pptx-bounds="48 512 928 222"><text x="52" y="550" font-size="28" fill="#3333B2">A third route: extract an executable program</text><text x="52" y="600">Gallina → OCaml, Haskell, or Scheme → compiled execution.</text><text x="52" y="652">A proof connects the Gallina program to its specification.</text><text x="52" y="688">Execution still trusts extraction and the target-language compiler.</text></g></svg>