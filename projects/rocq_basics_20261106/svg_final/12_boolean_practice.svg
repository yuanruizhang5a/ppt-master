<g id="specification" data-pptx-bounds="48 108 928 158"><text x="52" y="148" font-size="28" fill="#3333B2">Write the specification before the code</text><text x="52" y="196">nandb: true when at least one input is false.</text><text x="52" y="234">andb3: true only when all three inputs are true.</text></g>
