<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 44 928 466"><rect x="48" y="44" width="928" height="466" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">WORKED EXERCISE · SIMPLIFY A HYPOTHESIS</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="132">Theorem andb_true_elim2 : forall b c : bool,</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="164">  andb b c = true -&gt; c = true.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="204">Proof.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="236">  intros b c H. destruct b.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="268">  - simpl in H. rewrite -&gt; H. reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="300">  - simpl in H. destruct c.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="332">    + reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="364">    + rewrite -&gt; H. reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="396">Qed.</text></g><g id="reasoning" data-pptx-bounds="48 550 928 184"><text x="52" y="590">If b = true, simpl in H gives exactly c = true.</text><text x="52" y="630">If b = false, H becomes false = true.</text><text x="52" y="670">In the c = false branch, rewriting H turns the goal into true = true.</text><text x="52" y="706" font-size="20">A contradictory assumption can be used with the tactics already learned.</text></g></svg>