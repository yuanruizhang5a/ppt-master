<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Equality as a recursive computation</text></g><g id="code" data-pptx-bounds="48 108 928 420"><rect x="48" y="108" width="928" height="420" fill="#F5F5F8" /><text x="72" y="146" font-size="20" fill="#262686">eqb INSPECTS BOTH NUMBERS</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="196">Fixpoint eqb (n m : nat) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="228">  match n with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="260">  | O =&gt; match m with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="292">         | O =&gt; true | S m' =&gt; false end</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="324">  | S n' =&gt; match m with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="356">            | O =&gt; false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="388">            | S m' =&gt; eqb n' m'</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="420">            end</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="452">  end.</text></g><g id="trace" data-pptx-bounds="48 560 928 106"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="600">eqb 2 2 → eqb 1 1 → eqb 0 0 → true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="638">eqb 2 3 → eqb 1 2 → eqb 0 1 → false</text></g><g id="notation" data-pptx-bounds="48 692 928 58"><text x="52" y="726" font-size="20">Notation "x =? y" := (eqb x y) (at level 70) : nat_scope.</text></g></svg>