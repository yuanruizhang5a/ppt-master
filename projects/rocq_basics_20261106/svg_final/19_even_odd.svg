<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Recursive functions: even and odd</text></g>
<g id="code" data-pptx-bounds="48 108 928 350"><rect x="48" y="108" width="928" height="350" fill="#F5F5F8" /><text x="72" y="146" font-size="20" fill="#262686">Fixpoint ENABLES RECURSIVE CALLS</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="198">Fixpoint even (n : nat) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="230">  match n with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="262">  | O =&gt; true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="294">  | S O =&gt; false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="326">  | S (S n') =&gt; even n'</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="358">  end.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="406">Definition odd (n : nat) : bool := negb (even n).</text></g>
<g id="trace" data-pptx-bounds="48 494 928 110"><rect x="48" y="494" width="928" height="110" fill="#EDF5EF" /><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="540">even 4 → even 2 → even 0 → true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="578">odd 1 → true                 odd 4 → false</text></g><g id="rule" data-pptx-bounds="48 644 928 100"><text x="52" y="682">The recursive call uses n', a smaller piece of S (S n').</text></g></svg>