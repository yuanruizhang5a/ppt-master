<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Keep subgoals readable</text></g><g id="brace" data-pptx-bounds="48 110 928 242"><rect x="48" y="110" width="928" height="242" fill="#F5F5F8" /><text x="72" y="148" font-size="20" fill="#262686">BRACES CAN DELIMIT NESTED SUBPROOFS</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="198">intros b c. destruct b.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="232">{ destruct c. { reflexivity. } { reflexivity. } }</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="266">{ destruct c. { reflexivity. } { reflexivity. } }</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="312">(* -, +, * and repeated bullets also separate levels. *)</text></g><g id="intro" data-pptx-bounds="48 388 928 192"><text x="52" y="426" font-size="28" fill="#3333B2">Introduce and destruct in one step</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="480">intros [| n].    (* two nat constructors *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="522">intros [] [].    (* four cases for two booleans *)</text></g><g id="tradeoff" data-pptx-bounds="48 614 928 128"><text x="52" y="654">Intro patterns are concise but do not retain an eqn:E equation.</text><text x="52" y="692">Explicit names and bullets make larger proofs easier to maintain.</text></g></svg>