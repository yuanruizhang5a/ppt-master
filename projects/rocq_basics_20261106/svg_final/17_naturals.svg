<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Natural numbers: zero and successor</text></g>
<g id="code" data-pptx-bounds="48 112 928 210"><rect x="48" y="112" width="928" height="210" fill="#F5F5F8" /><text x="72" y="150" font-size="20" fill="#262686">INSIDE Module NatPlayground</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="206">Inductive nat : Type :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="242">  | O</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="278">  | S (n : nat).</text></g>
<g id="representation" data-pptx-bounds="48 362 928 178"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="402">O             represents 0</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="444">S O           represents 1</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="486">S (S (S O))   represents 3</text></g><g id="meaning" data-pptx-bounds="48 570 928 170"><text x="52" y="610">Two constructors generate an infinite set of finite values.</text><text x="52" y="648">O is the letter O; ordinary decimal 0 is notation.</text><text x="52" y="686">The names are arbitrary: how we use the marks gives them meaning.</text></g></svg>