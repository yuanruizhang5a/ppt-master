<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" />
<g id="code" data-pptx-bounds="48 44 928 408"><rect x="48" y="44" width="928" height="408" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">CONDITIONALS INSPECT TWO-CONSTRUCTOR TYPES</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="134">Definition negb' (b : bool) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="168">  if b then false else true.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="222">Inductive bw : Type := bw_black | bw_white.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="276">Definition invert (x : bw) : bw :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="310">  if x then bw_white else bw_black.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="364">Compute (invert bw_black).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="398">Compute (invert bw_white).</text></g>
<g id="result" data-pptx-bounds="48 486 928 100"><rect x="48" y="486" width="928" height="100" fill="#EDF5EF" /><text x="72" y="528" fill="#006B2D">bw_white : bw</text><text x="72" y="568" fill="#006B2D">bw_black : bw</text></g><g id="rule" data-pptx-bounds="48 622 928 120"><text x="52" y="658">The first constructor selects then; the second selects else.</text><text x="52" y="696">The constructor names need not be true and false.</text></g></svg>