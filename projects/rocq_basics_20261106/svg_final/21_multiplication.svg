<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Multiplication reuses addition</text></g><g id="code" data-pptx-bounds="48 112 928 280"><rect x="48" y="112" width="928" height="280" fill="#F5F5F8" /><text x="72" y="150" font-size="20" fill="#262686">GROUPED BINDERS: (n m : nat)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="202">Fixpoint mult (n m : nat) : nat :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="236">  match n with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="270">  | O =&gt; O</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="304">  | S n' =&gt; plus m (mult n' m)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="338">  end.</text></g><g id="trace" data-pptx-bounds="48 434 928 160"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="474">mult 3 3 → plus 3 (mult 2 3)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="514">         → plus 3 (plus 3 (plus 3 0))</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="554">         → 9</text></g><g id="test" data-pptx-bounds="48 634 928 104"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="674">Example test_mult1 : mult 3 3 = 9.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="710">Proof. simpl. reflexivity. Qed.</text></g></svg>