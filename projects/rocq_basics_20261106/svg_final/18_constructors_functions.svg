<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" />
<g id="code" data-pptx-bounds="48 44 928 398"><rect x="48" y="44" width="928" height="398" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">CONSTRUCTING DATA IS DIFFERENT FROM COMPUTING</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="132">Definition pred (n : nat) : nat :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="164">  match n with O =&gt; O | S n' =&gt; n' end.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="214">Definition minustwo (n : nat) : nat :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="246">  match n with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="278">  | O =&gt; O</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="310">  | S O =&gt; O</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="342">  | S (S n') =&gt; n'</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="374">  end.</text></g>
<g id="results" data-pptx-bounds="48 476 928 100"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="514">pred 0 → 0     pred 3 → 2     minustwo 4 → 2</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="554">Check S : nat -&gt; nat.   (* same type as pred *)</text></g><g id="distinction" data-pptx-bounds="48 614 928 130"><text x="52" y="652">S stores a successor shape; it does not reduce by a function rule.</text><text x="52" y="690">pred and minustwo have computation rules that inspect that shape.</text></g></svg>