<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Rewrite using a quantified theorem</text></g><g id="lemmas" data-pptx-bounds="48 104 928 150"><text x="52" y="144" font-size="20" fill="#262686">LIBRARY STATEMENTS · NOTICE THEIR ORIENTATION</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="190">mult_n_O  : forall n, 0 = n * 0</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="230">mult_n_Sm : forall n m, n * m + n = n * S m</text></g><g id="code" data-pptx-bounds="48 286 928 340"><rect x="48" y="286" width="928" height="340" fill="#F5F5F8" /><text x="72" y="324" font-size="20" fill="#262686">ROCQ INFERS THE QUANTIFIED ARGUMENT AT EACH USE</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="374">Theorem mult_n_0_m_0 : forall p q : nat,</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="406">  p * 0 + q * 0 = 0.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="446">Proof.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="478">  intros p q.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="510">  rewrite &lt;- mult_n_O.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="542">  rewrite &lt;- mult_n_O.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="574">  reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="606">Qed.</text></g><g id="result" data-pptx-bounds="48 648 928 92"><text x="52" y="688">Goal sequence: p * 0 + q * 0 = 0 → 0 + q * 0 = 0 → 0 + 0 = 0.</text></g></svg>