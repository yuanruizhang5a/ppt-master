<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Tuples from one constructor</text></g>
<g id="code" data-pptx-bounds="48 106 928 396"><rect x="48" y="106" width="928" height="396" fill="#F5F5F8" /><text x="72" y="144" font-size="20" fill="#262686">INSIDE Module TuplePlayground</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="194">Inductive bit : Type := B1 | B0.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="236">Inductive nybble : Type :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="268">  | bits (b0 b1 b2 b3 : bit).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="312">Definition all_zero (nb : nybble) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="344">  match nb with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="376">  | bits B0 B0 B0 B0 =&gt; true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="408">  | bits _  _  _  _  =&gt; false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="440">  end.</text></g><g id="result" data-pptx-bounds="48 536 928 116"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="578">all_zero (bits B1 B0 B1 B0)  → false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="618">all_zero (bits B0 B0 B0 B0)  → true</text></g><g id="idea" data-pptx-bounds="48 680 928 62"><text x="52" y="714">One constructor wraps four fields; matching unwraps them.</text></g></svg>