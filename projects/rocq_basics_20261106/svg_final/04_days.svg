<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Build an enumerated type</text></g>
<g id="code" data-pptx-bounds="48 108 570 432"><rect x="48" y="108" width="570" height="432" fill="#F5F5F8" /><text x="72" y="146" font-size="20" fill="#262686">GALLINA · A NEW TYPE</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="196">Inductive day : Type :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="230">  | monday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="264">  | tuesday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="298">  | wednesday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="332">  | thursday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="366">  | friday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="400">  | saturday</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="434">  | sunday.</text></g>
<g id="meaning" data-pptx-bounds="654 126 322 410"><text x="658" y="172" font-size="28" fill="#3333B2">Read it as a set</text><text x="658" y="226">day is the type.</text><text x="658" y="270">Its seven constructors</text><text x="658" y="306">are its seven values.</text><text x="658" y="366">The final period ends</text><text x="658" y="402">the declaration.</text></g>
<g id="result" data-pptx-bounds="48 586 928 142"><text x="52" y="628" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">Check monday.       (* monday : day *)</text><text x="52" y="688">Rocq's standard data types can be defined by this same mechanism.</text></g></svg>