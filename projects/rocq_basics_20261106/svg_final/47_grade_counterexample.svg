<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 44 928 230"><rect x="48" y="44" width="928" height="230" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">LOWER A LETTER · SATURATE AT F</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="134">Definition lower_letter (l : letter) : letter :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="168">  match l with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="202">  | A =&gt; B | B =&gt; C | C =&gt; D | D =&gt; F | F =&gt; F</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="236">  end.</text></g><g id="failed" data-pptx-bounds="48 314 928 150"><text x="52" y="354" font-size="28" fill="#B42318">The tempting theorem is false</text><text x="72" y="410" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">forall l, letter_comparison (lower_letter l) l = Lt</text></g><g id="counterexample" data-pptx-bounds="48 500 928 154"><rect x="48" y="500" width="928" height="154" fill="#F5F5F8" /><text x="72" y="542" font-size="20" fill="#B42318">COUNTEREXAMPLE l = F</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="592">lower_letter F = F</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="630">letter_comparison F F = Eq    (* not Lt *)</text></g><g id="lesson" data-pptx-bounds="48 686 928 62"><text x="52" y="720">A stuck proof can reveal a missing precondition, not a missing tactic.</text></g></svg>