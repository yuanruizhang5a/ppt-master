<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Modules keep names separate</text></g>
<g id="code" data-pptx-bounds="48 112 928 344"><rect x="48" y="112" width="928" height="344" fill="#F5F5F8" /><text x="72" y="150" font-size="20" fill="#262686">TWO DEFINITIONS CALLED foo</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="204">Module Playground.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="238">  Definition foo : rgb := blue.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="272">End Playground.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="326">Definition foo : bool := true.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="380">Check Playground.foo : rgb.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="414">Check foo : bool.</text></g><g id="results" data-pptx-bounds="48 500 928 112"><text x="52" y="540" fill="#006B2D">Playground.foo names the value blue.</text><text x="52" y="588">The later unqualified foo names the value true.</text></g><g id="purpose" data-pptx-bounds="48 650 928 90"><text x="52" y="690">We use modules to experiment without colliding with library definitions.</text></g></svg>