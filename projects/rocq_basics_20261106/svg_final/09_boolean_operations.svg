<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Conjunction and disjunction</text></g>
<g id="code" data-pptx-bounds="48 96 928 284"><rect x="48" y="96" width="928" height="284" fill="#F5F5F8" /><text x="72" y="132" font-size="20" fill="#262686">TWO ARGUMENTS · APPLICATION IS andb true false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="176">Definition andb (b1 b2 : bool) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="208">  match b1 with true =&gt; b2 | false =&gt; false end.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="252">Definition orb (b1 b2 : bool) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="284">  match b1 with true =&gt; true | false =&gt; b2 end.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="328">Notation "x &amp;&amp; y" := (andb x y).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="360">Notation "x || y" := (orb x y).</text></g>
