<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="tests" data-pptx-bounds="48 44 928 268"><rect x="48" y="44" width="928" height="268" fill="#EDF5EF" /><text x="72" y="82" font-size="20" fill="#006B2D">TEST RESULTS · READ “LOWER” AT THE BOUNDARIES</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="134">lower_grade (Grade A Plus)    → Grade A Natural</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="170">lower_grade (Grade A Natural) → Grade A Minus</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="206">lower_grade (Grade A Minus)   → Grade B Plus</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="242">lower_grade (Grade F Natural) → Grade F Minus</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="278">lower_grade (Grade F Minus)   → Grade F Minus</text></g><g id="theorem" data-pptx-bounds="48 346 928 204"><rect x="48" y="346" width="928" height="204" fill="#F5F5F8" /><text x="72" y="384" font-size="20" fill="#262686">PROPERTY TO PROVE · STRICT DECREASE ABOVE F−</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="434">forall g : grade,</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="468">  grade_comparison (Grade F Minus) g = Lt -&gt;</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="502">  grade_comparison (lower_grade g) g = Lt</text></g><g id="strategy" data-pptx-bounds="48 582 928 160"><text x="52" y="622">Proof plan: unpack Grade, split the modifier, then rewrite.</text><text x="52" y="658">Only Minus needs letter cases; use lower_grade_F_Minus at F−.</text><text x="52" y="698">Two lowerings of B− give C; three give C−.</text></g></svg>