<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" />
<g id="code" data-pptx-bounds="48 44 928 496"><rect x="48" y="44" width="928" height="496" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">PATTERNS REVEAL THE CONSTRUCTOR AND ITS CONTENTS</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="130">Definition monochrome (c : color) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="162">  match c with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="194">  | black =&gt; true | white =&gt; true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="226">  | primary p =&gt; false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="258">  end.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="304">Definition isred (c : color) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="336">  match c with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="368">  | black =&gt; false | white =&gt; false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="400">  | primary red =&gt; true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="432">  | primary _ =&gt; false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="464">  end.</text></g>
<g id="result" data-pptx-bounds="48 568 928 100"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="604">isred (primary red)    → true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="642">isred (primary green)  → false</text></g><g id="rule" data-pptx-bounds="48 682 928 66"><text x="52" y="716" font-size="20">Cases are tried in order; _ ignores a value. Here it catches the remaining rgb cases.</text></g></svg>