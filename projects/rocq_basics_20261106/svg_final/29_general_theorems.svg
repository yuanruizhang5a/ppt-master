<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">From examples to general theorems</text></g><g id="code" data-pptx-bounds="48 120 928 300"><rect x="48" y="120" width="928" height="300" fill="#F5F5F8" /><text x="72" y="158" font-size="20" fill="#262686">ONE INSTANCE VERSUS EVERY NATURAL NUMBER</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="214">Example plus_1_1 : 1 + 1 = 2.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="252">Proof. simpl. reflexivity. Qed.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="314">Theorem plus_O_n : forall n : nat, 0 + n = n.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="352">Proof. intros n. simpl. reflexivity. Qed.</text></g><g id="meaning" data-pptx-bounds="48 464 928 250"><text x="52" y="504" font-size="28" fill="#3333B2">The same kernel checks both claims</text><text x="52" y="558">forall n means the proof must work for an arbitrary n.</text><text x="52" y="600">HTML prints ∀; source files use the keyword forall.</text><text x="52" y="642">Example, Theorem, and Lemma differ mainly in writing style.</text><text x="52" y="684">Tactics are commands between Proof and Qed.</text></g></svg>