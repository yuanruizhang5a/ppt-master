<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="ending"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Check your understanding</text></g><g id="prompts" data-pptx-bounds="48 106 928 280"><text x="52" y="146">1  Explain why primary red is valid but primary (primary red) is not.</text><text x="52" y="202">2  Why does 0 + n reduce while n + 0 can get stuck?</text><text x="52" y="258">3  When do you need rewrite, and when do you need destruct?</text><text x="52" y="314">4  Which boundary cases challenge “lowering always decreases”?</text><text x="52" y="370">5  What is still missing after seven passing binary tests?</text></g><g id="code" data-pptx-bounds="48 426 928 186"><rect x="48" y="426" width="928" height="186" fill="#F5F5F8" /><text x="72" y="464" font-size="20" fill="#262686">PREDICT, THEN CHECK</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="516">Compute (bin_to_nat (incr (B1 (B1 Z)))).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="558">Check primary.</text></g><g id="answers" data-pptx-bounds="48 652 928 92"><text x="52" y="692" fill="#006B2D">Results: 4 : nat     and     primary : rgb → color.</text><text x="52" y="730" font-size="20">Next: use stronger proof methods when the property follows recursive structure.</text></g></svg>