<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="script" data-pptx-bounds="48 44 928 174"><rect x="48" y="44" width="928" height="174" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">READ THE GOAL AND THE CONTEXT</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="134">Theorem plus_O_n : forall n : nat, 0 + n = n.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="172">Proof. intros n. simpl. reflexivity. Qed.</text></g><g id="states" data-pptx-bounds="48 258 928 280"><text x="52" y="298" font-size="28" fill="#3333B2">The proof state changes one tactic at a time</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="356">Start:       goal  forall n : nat, 0 + n = n</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="404">intros n:    n : nat   |   goal  0 + n = n</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="452">simpl:       n : nat   |   goal  n = n</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="500">reflexivity: no goals remain</text></g><g id="interpretation" data-pptx-bounds="48 586 928 146"><text x="52" y="626">The context records what is currently available.</text><text x="52" y="664">The goal records what remains to establish.</text><text x="52" y="702">intros can choose a different name: the reasoning is unchanged.</text></g></svg>