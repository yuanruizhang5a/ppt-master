<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="unfolding" data-pptx-bounds="48 42 928 170"><text x="52" y="80" font-size="28" fill="#3333B2">Expose a definition with an equality lemma</text><text x="52" y="130">apply_late_policy_unfold states that the function application</text><text x="52" y="166">equals its defining conditional expression. Its proof is reflexivity.</text></g><g id="code" data-pptx-bounds="48 242 928 364"><rect x="48" y="242" width="928" height="364" fill="#F5F5F8" /><text x="72" y="280" font-size="20" fill="#262686">WORKED EXERCISE · NO PENALTY WITH FEWER THAN 9 DAYS</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="330">Theorem no_penalty_for_mostly_on_time :</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="362">  forall (late_days : nat) (g : grade),</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="394">  (late_days &lt;? 9 = true) -&gt;</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="426">  apply_late_policy late_days g = g.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="466">Proof.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="498">  intros late_days g H.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="530">  rewrite apply_late_policy_unfold.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="562">  rewrite H. reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="594">Qed.</text></g><g id="result" data-pptx-bounds="48 620 928 120"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="660">if late_days &lt;? 9 then g else ... = g</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="700">→ if true then g else ... = g  →  g = g</text></g></svg>