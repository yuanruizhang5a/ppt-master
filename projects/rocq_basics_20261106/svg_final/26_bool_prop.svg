<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Boolean equality versus a proposition</text></g><g id="boolean" data-pptx-bounds="48 120 440 340"><rect x="48" y="120" width="440" height="340" fill="#F5F5F8" /><text x="72" y="166" font-size="28" fill="#3333B2">An executable question</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="232">Check (2 =? 3).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="274">(* bool *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="330">Compute (2 =? 3).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="72" y="372">(* false : bool *)</text></g><g id="proposition" data-pptx-bounds="536 120 440 340"><rect x="536" y="120" width="440" height="340" fill="#EDF5EF" /><text x="560" y="166" font-size="28" fill="#006B2D">A claim to establish</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="560" y="232">Check (2 = 3).</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="560" y="274">(* Prop *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="560" y="330">Example two_eq_two :</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="560" y="364">  2 = 2.</text></g><g id="distinction" data-pptx-bounds="48 508 928 218"><text x="52" y="554" font-size="28" fill="#3333B2">Different types, different jobs</text><text x="52" y="610">=? computes true or false; = forms a logical proposition.</text><text x="52" y="652">A boolean test can itself appear inside a proposition:</text><text x="72" y="708" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">(2 =? 3) = false</text></g></svg>