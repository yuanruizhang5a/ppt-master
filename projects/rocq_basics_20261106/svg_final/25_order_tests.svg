<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="code" data-pptx-bounds="48 44 928 410"><rect x="48" y="44" width="928" height="410" fill="#F5F5F8" /><text x="72" y="82" font-size="20" fill="#262686">LESS-THAN-OR-EQUAL · THEN STRICT LESS-THAN</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="132">Fixpoint leb (n m : nat) : bool :=</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="164">  match n with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="196">  | O =&gt; true</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="228">  | S n' =&gt; match m with</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="260">            | O =&gt; false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="292">            | S m' =&gt; leb n' m' end</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="324">  end.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="372">Definition ltb (n m : nat) : bool := leb (S n) m.</text></g><g id="results" data-pptx-bounds="48 488 928 128"><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="528">2 &lt;=? 2 → true    2 &lt;=? 4 → true    4 &lt;=? 2 → false</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" x="52" y="572">2 &lt;?  2 → false   2 &lt;?  4 → true    4 &lt;?  2 → false</text></g><g id="notation" data-pptx-bounds="48 650 928 92"><text x="52" y="686">The notations &lt;=? and &lt;? stand for leb and ltb.</text><text x="52" y="720" font-size="20">ltb is a worked exercise solution: reuse leb rather than invent recursion.</text></g></svg>