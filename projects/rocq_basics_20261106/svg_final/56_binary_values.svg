<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="orientation" data-pptx-bounds="48 40 928 120"><text x="52" y="82" font-size="28" fill="#3333B2">Read the least-significant bit first</text><text x="52" y="132">The outermost constructor is the low-order bit.</text></g><g id="binary-values" data-pptx-bounds="72 190 880 396" data-pptx-replace-with="table"><metadata type="application/json">{"name":"binary-values","x":72,"y":190,"width":880,"height":396,"columns":["Decimal","Constructor expression","Usual binary"],"rows":[["0","Z","0"],["1","B1 Z","1"],["2","B0 (B1 Z)","10"],["3","B1 (B1 Z)","11"],["4","B0 (B0 (B1 Z))","100"],["8","B0 (B0 (B0 (B1 Z)))","1000"]],"style":{"font_family":"Arial","font_size":22,"header_fill":"#F5F5F8","body_text":"#171717"}}</metadata><rect x="72" y="190" width="880" height="56" fill="#F5F5F8" /><path d="M72 246H952 M72 302H952 M72 358H952 M72 414H952 M72 470H952 M72 526H952 M72 586H952" fill="none" stroke="#D6D6E5" /><g font-size="22"><text x="92" y="228">Decimal</text><text x="276" y="228">Constructor expression</text><text x="752" y="228">Usual binary</text><text x="92" y="284">0</text><text x="276" y="284">Z</text><text x="752" y="284">0</text><text x="92" y="340">1</text><text x="276" y="340">B1 Z</text><text x="752" y="340">1</text><text x="92" y="396">2</text><text x="276" y="396">B0 (B1 Z)</text><text x="752" y="396">10</text><text x="92" y="452">3</text><text x="276" y="452">B1 (B1 Z)</text><text x="752" y="452">11</text><text x="92" y="508">4</text><text x="276" y="508">B0 (B0 (B1 Z))</text><text x="752" y="508">100</text><text x="92" y="566">8</text><text x="276" y="566">B0 (B0 (B0 (B1 Z)))</text><text x="752" y="566">1000</text></g></g><g id="zero" data-pptx-bounds="48 624 928 118"><text x="52" y="664">Comprehension check: what does B0 Z represent?</text><text x="52" y="704" fill="#006B2D">Zero again. Different constructor values can denote the same number.</text></g></svg>