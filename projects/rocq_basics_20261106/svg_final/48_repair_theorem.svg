<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#171717" data-pptx-page-role="content"><rect width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="0 0 1024 70"><rect width="1024" height="64" fill="#3333B2" /><text x="32" y="44" font-size="36" fill="#FFFFFF">Repair the statement with a precondition</text></g><g id="code" data-pptx-bounds="48 106 928 424"><rect x="48" y="106" width="928" height="424" fill="#F5F5F8" /><text x="72" y="144" font-size="20" fill="#262686">WORKED PROOF · EXCLUDE THE BOTTOM LETTER</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="194">Theorem lower_letter_lowers : forall l : letter,</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="226">  letter_comparison F l = Lt -&gt;</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="258">  letter_comparison (lower_letter l) l = Lt.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="298">Proof.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="330">  intros l H. destruct l.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="362">  - reflexivity.    (* A *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="394">  - reflexivity.    (* B *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="426">  - reflexivity.    (* C *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="458">  - reflexivity.    (* D *)</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="490">  - simpl in H. simpl. rewrite H. reflexivity.</text><text font-size="22" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve" x="72" y="522">Qed.</text></g><g id="reason" data-pptx-bounds="48 566 928 166"><text x="52" y="606">The hypothesis says F is strictly below l.</text><text x="52" y="646">For l = F it becomes Eq = Lt, an impossible assumption.</text><text x="52" y="686">For the four other letters, the conclusion computes directly.</text></g></svg>