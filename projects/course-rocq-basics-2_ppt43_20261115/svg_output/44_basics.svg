<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY CASE ANALYSIS</text><text x="56" y="100" font-size="34" fill="#14324B">Case analysis with destruct</text></g>
<g id="proof" data-pptx-bounds="48 145 928 270"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Theorem plus_1_neq_0 : forall n : nat,<tspan x="56" dy="32">  (n + 1) =? 0 = false.</tspan><tspan x="56" dy="36">Proof.</tspan><tspan x="56" dy="30">  intros n. destruct n as [| n'] eqn:E.</tspan><tspan x="56" dy="30">  - reflexivity.</tspan><tspan x="56" dy="30">  - reflexivity.</tspan><tspan x="56" dy="30">Qed.</tspan></text></g>
<g id="pattern" data-pptx-bounds="48 450 928 235"><text x="56" y="488">destruct generates one subgoal per constructor.<tspan x="56" dy="42">as [| n′] names the constructor arguments:</tspan><tspan x="56" dy="36">O takes none; S takes one, called n′.</tspan><tspan x="56" dy="48">eqn:E records n = O or n = S n′ in the respective case.</tspan><tspan x="56" dy="36">Keeping the equation helps document the proof state.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1183–1220                                                      44 / 80</text></svg>
