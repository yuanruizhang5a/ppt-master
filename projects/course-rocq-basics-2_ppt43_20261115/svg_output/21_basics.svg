<g id="tuple" data-pptx-bounds="48 145 928 350"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Module TuplePlayground.<tspan x="56" dy="44">Inductive bit : Type :=</tspan><tspan x="56" dy="28">  | B1</tspan><tspan x="56" dy="28">  | B0.</tspan><tspan x="56" dy="44">Inductive nybble : Type :=</tspan><tspan x="56" dy="28">  | bits (b0 b1 b2 b3 : bit).</tspan><tspan x="56" dy="44">Check (bits B1 B0 B1 B0) : nybble.</tspan></text></g>
<g id="meaning" data-pptx-bounds="48 525 928 160"><text x="56" y="562">One constructor with several parameters forms a tuple type.<tspan x="56" dy="42">A nybble is four bits: half a byte.</tspan><tspan x="56" dy="42">The bits constructor wraps those four components.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 520–541 · Tuples                                               21 / 80</text></svg>
