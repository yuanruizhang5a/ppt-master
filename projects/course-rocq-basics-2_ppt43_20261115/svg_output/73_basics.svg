<g id="exercise" data-pptx-bounds="48 155 928 280"><text x="56" y="194" font-family="Consolas" font-size="20" xml:space="preserve">Theorem no_penalty_for_mostly_on_time :<tspan x="56" dy="34">  forall (late_days : nat) (g : grade),</tspan><tspan x="56" dy="34">    (late_days &lt;? 9 = true) -&gt;</tspan><tspan x="56" dy="34">    apply_late_policy late_days g = g.</tspan><tspan x="56" dy="44">Proof.</tspan><tspan x="56" dy="34">  (* FILL IN HERE *) Admitted.</tspan></text></g>
<g id="hint" data-pptx-bounds="48 480 928 190"><text x="56" y="520">At most eight late days leave the grade unchanged.<tspan x="56" dy="46">Source hint: use apply_late_policy_unfold,</tspan><tspan x="56" dy="38">then rewrite with the hypothesis.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1883–1895                                                      73 / 80</text></svg>
