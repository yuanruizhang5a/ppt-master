<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Recursive multiplication</text></g>
<g id="code" data-pptx-bounds="48 145 928 350"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Fixpoint mult (n m : nat) : nat :=<tspan x="56" dy="32">  match n with</tspan><tspan x="56" dy="32">  | O =&gt; O</tspan><tspan x="56" dy="32">  | S n' =&gt; plus m (mult n' m)</tspan><tspan x="56" dy="32">  end.</tspan><tspan x="56" dy="48">Example test_mult1: (mult 3 3) = 9.</tspan><tspan x="56" dy="32">Proof. simpl. reflexivity. Qed.</tspan></text></g>
<g id="grouped-args" data-pptx-bounds="48 530 928 155"><text x="56" y="568">Arguments of the same type may share one annotation.</text><text x="56" y="628" font-family="Consolas" font-size="20">(n m : nat)     means     (n : nat) (m : nat)</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 772–786                                                        29 / 80</text></svg>
