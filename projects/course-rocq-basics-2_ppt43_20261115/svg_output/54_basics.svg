<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">FIXPOINTS AND STRUCTURAL RECURSION · OPTIONAL</text><text x="56" y="100" font-size="34" fill="#14324B">Why recursive calls terminate</text></g>
<g id="plus-prime" data-pptx-bounds="48 145 928 255"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Fixpoint plus' (n : nat) (m : nat) : nat :=<tspan x="56" dy="32">  match n with</tspan><tspan x="56" dy="32">  | O =&gt; m</tspan><tspan x="56" dy="32">  | S n' =&gt; S (plus' n' m)</tspan><tspan x="56" dy="32">  end.</tspan></text></g>
<g id="termination" data-pptx-bounds="48 440 928 245"><text x="56" y="478">Rocq reports “decreasing on 1st argument”.<tspan x="56" dy="42">Each recursive call uses a strictly smaller part of n.</tspan><tspan x="56" dy="42">Every Fixpoint needs a decreasing argument.</tspan><tspan x="56" dy="48">This guarantees termination, but decreasing analysis is limited:</tspan><tspan x="56" dy="36">some terminating functions require an unnatural formulation.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1442–1465                                                      54 / 80</text></svg>
