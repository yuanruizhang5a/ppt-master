<g id="exercise" data-pptx-bounds="48 155 928 300"><text x="56" y="194" font-family="Consolas" font-size="20" xml:space="preserve">Theorem lower_letter_lowers :<tspan x="56" dy="34">  forall (l : letter),</tspan><tspan x="56" dy="34">    letter_comparison F l = Lt -&gt;</tspan><tspan x="56" dy="34">    letter_comparison (lower_letter l) l = Lt.</tspan><tspan x="56" dy="44">Proof.</tspan><tspan x="56" dy="34">  (* FILL IN HERE *) Admitted.</tspan></text></g>
<g id="hypothesis" data-pptx-bounds="48 500 928 160"><text x="56" y="540">The hypothesis says F is strictly below l.<tspan x="56" dy="42">It rules out the problematic case l = F.</tspan><tspan x="56" dy="42">Prove this corrected version.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1730–1742                                                      67 / 80</text></svg>
