<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#9A5800">MORE EXERCISES · BINARY · 3 STARS · STANDARD</text><text x="56" y="100" font-size="34" fill="#14324B">Binary Numerals</text></g>
<g id="representations" data-pptx-bounds="48 140 928 340"><text x="56" y="174" font-family="Consolas" font-size="20" xml:space="preserve">0: Z                      unary O<tspan x="56" dy="30">1: B1 Z                   unary S O</tspan><tspan x="56" dy="30">2: B0 (B1 Z)              unary S (S O)</tspan><tspan x="56" dy="30">3: B1 (B1 Z)              unary S (S (S O))</tspan><tspan x="56" dy="30">4: B0 (B0 (B1 Z))         unary S (S (S (S O)))</tspan><tspan x="56" dy="30">5: B1 (B0 (B1 Z))         unary S (S (S (S (S O))))</tspan><tspan x="56" dy="30">6: B0 (B1 (B1 Z))         unary S (S (S (S (S (S O)))))</tspan><tspan x="56" dy="30">7: B1 (B1 (B1 Z))         unary S (S (S (S (S (S (S O))))))</tspan><tspan x="56" dy="30">8: B0 (B0 (B0 (B1 Z)))    unary S (S (S (S (S (S (S (S O)))))))</tspan></text></g>
<g id="bit-order" data-pptx-bounds="48 515 928 180"><text x="56" y="552">The low-order bit is on the left, the high-order bit on the right.<tspan x="56" dy="40">This is the reverse of customary binary notation.</tspan><tspan x="56" dy="46">Source comprehension check:</tspan><tspan x="56" dy="36">What unary numeral does B0 Z represent?</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1909–1938                                                      75 / 80</text></svg>
