<g id="other-nat" data-pptx-bounds="48 145 928 205"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Inductive otherNat : Type :=<tspan x="56" dy="30">  | stop</tspan><tspan x="56" dy="30">  | tick (foo : otherNat).</tspan></text><text x="56" y="306">Constructor names are arbitrary; use gives them interpretation.</text></g>
<g id="pred" data-pptx-bounds="48 390 928 290"><text x="56" y="426" font-family="Consolas" font-size="20" xml:space="preserve">Definition pred (n : nat) : nat :=<tspan x="56" dy="30">  match n with</tspan><tspan x="56" dy="30">  | O =&gt; O</tspan><tspan x="56" dy="30">  | S n' =&gt; n'</tspan><tspan x="56" dy="30">  end.</tspan><tspan x="56" dy="40">End NatPlayground.</tspan></text><text x="56" y="654" font-size="22">After End, nat refers again to the standard library type.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 641–670                                                        25 / 80</text></svg>
