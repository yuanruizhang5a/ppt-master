<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Numerals, minustwo, and constructors</text></g>
<g id="code" data-pptx-bounds="48 145 928 360"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Check (S (S (S (S O)))).  (* ===&gt; 4 : nat *)<tspan x="56" dy="42">Definition minustwo (n : nat) : nat :=</tspan><tspan x="56" dy="28">  match n with</tspan><tspan x="56" dy="28">  | O =&gt; O</tspan><tspan x="56" dy="28">  | S O =&gt; O</tspan><tspan x="56" dy="28">  | S (S n') =&gt; n'</tspan><tspan x="56" dy="28">  end.</tspan><tspan x="56" dy="38">Compute (minustwo 4).  (* ===&gt; 2 : nat *)</tspan><tspan x="56" dy="38">Check S        : nat -&gt; nat.</tspan><tspan x="56" dy="26">Check pred     : nat -&gt; nat.</tspan><tspan x="56" dy="26">Check minustwo : nat -&gt; nat.</tspan></text></g>
<g id="distinction" data-pptx-bounds="48 545 928 145"><text x="56" y="580">Decimal numerals are parsing and printing conveniences.<tspan x="56" dy="38">S builds a representation; pred and minustwo have</tspan><tspan x="56" dy="36">computation rules. Applying S itself performs no computation.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 671–711                                                        26 / 80</text></svg>
