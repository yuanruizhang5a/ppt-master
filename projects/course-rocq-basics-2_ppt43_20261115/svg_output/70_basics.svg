<g id="exercise" data-pptx-bounds="48 145 928 265"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Theorem lower_grade_lowers :<tspan x="56" dy="32">  forall (g : grade),</tspan><tspan x="56" dy="32">    grade_comparison (Grade F Minus) g = Lt -&gt;</tspan><tspan x="56" dy="32">    grade_comparison (lower_grade g) g = Lt.</tspan><tspan x="56" dy="42">Proof.</tspan><tspan x="56" dy="32">  (* FILL IN HERE *) Admitted.</tspan></text></g>
<g id="hints" data-pptx-bounds="48 450 928 230"><text x="56" y="488">Starting above F−, lowering really gives a lower grade.<tspan x="56" dy="46">Use destruct judiciously, together with rewriting.</tspan><tspan x="56" dy="42">With the suggested grade_comparison, only one case</tspan><tspan x="56" dy="36">requires destructing a letter.</tspan><tspan x="56" dy="42">The F case may benefit from lower_grade_F_Minus.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1816–1837                                                      70 / 80</text></svg>
