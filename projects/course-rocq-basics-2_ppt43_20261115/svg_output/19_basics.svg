<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NEW TYPES FROM OLD</text><text x="56" y="100" font-size="34" fill="#14324B">Matching constructor arguments</text></g>
<g id="isred" data-pptx-bounds="48 145 928 310"><text x="56" y="184" font-family="Consolas" font-size="20" xml:space="preserve">Definition isred (c : color) : bool :=<tspan x="56" dy="32">  match c with</tspan><tspan x="56" dy="32">  | black =&gt; false</tspan><tspan x="56" dy="32">  | white =&gt; false</tspan><tspan x="56" dy="32">  | primary red =&gt; true</tspan><tspan x="56" dy="32">  | primary _ =&gt; false</tspan><tspan x="56" dy="32">  end.</tspan></text></g>
<g id="patterns" data-pptx-bounds="48 485 928 200"><text x="56" y="524">A pattern for primary must include its argument.<tspan x="56" dy="42">Use a variable, a suitable constant, or the wildcard _.</tspan><tspan x="56" dy="42">After the red branch, primary _ covers the other rgb values.</tspan><tspan x="56" dy="36">The wildcard has the same effect as an unused variable p.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 481–499                                                        19 / 80</text></svg>
