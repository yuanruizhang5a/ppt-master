<g id="exercise" data-pptx-bounds="48 290 928 300"><text x="56" y="330" font-family="Consolas" font-size="20" xml:space="preserve">Theorem identity_fn_applied_twice :<tspan x="56" dy="34">  forall (f : bool -&gt; bool),</tspan><tspan x="56" dy="34">  (forall (x : bool), f x = x) -&gt;</tspan><tspan x="56" dy="34">  forall (b : bool), f (f b) = b.</tspan><tspan x="56" dy="44">Proof.</tspan><tspan x="56" dy="34">  (* FILL IN HERE *) Admitted.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1482–1500 · More Exercises / Warmups                         56 / 80</text></svg>
