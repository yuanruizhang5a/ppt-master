<g id="definitions" data-pptx-bounds="48 145 928 485"><text x="56" y="176" font-family="Consolas" font-size="20" xml:space="preserve">Inductive bool : Type := | true | false.<tspan x="56" dy="40">Definition negb (b:bool) : bool :=</tspan><tspan x="56" dy="26">  match b with</tspan><tspan x="56" dy="26">  | true =&gt; false | false =&gt; true</tspan><tspan x="56" dy="26">  end.</tspan><tspan x="56" dy="40">Definition andb (b1:bool) (b2:bool) : bool :=</tspan><tspan x="56" dy="26">  match b1 with</tspan><tspan x="56" dy="26">  | true =&gt; b2 | false =&gt; false</tspan><tspan x="56" dy="26">  end.</tspan><tspan x="56" dy="40">Definition orb (b1:bool) (b2:bool) : bool :=</tspan><tspan x="56" dy="26">  match b1 with</tspan><tspan x="56" dy="26">  | true =&gt; true | false =&gt; b2</tspan><tspan x="56" dy="26">  end.</tspan></text></g>
