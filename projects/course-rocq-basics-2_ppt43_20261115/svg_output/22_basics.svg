<g id="all-zero" data-pptx-bounds="48 145 928 400"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Definition all_zero (nb : nybble) : bool :=<tspan x="56" dy="28">  match nb with</tspan><tspan x="56" dy="28">  | (bits B0 B0 B0 B0) =&gt; true</tspan><tspan x="56" dy="28">  | (bits _ _ _ _) =&gt; false</tspan><tspan x="56" dy="28">  end.</tspan><tspan x="56" dy="42">Compute (all_zero (bits B1 B0 B1 B0)).</tspan><tspan x="56" dy="28">(* ===&gt; false : bool *)</tspan><tspan x="56" dy="38">Compute (all_zero (bits B0 B0 B0 B0)).</tspan><tspan x="56" dy="28">(* ===&gt; true : bool *)</tspan><tspan x="56" dy="38">End TuplePlayground.</tspan></text></g>
<g id="wildcard" data-pptx-bounds="48 580 928 100"><text x="56" y="620">Pattern matching unwraps the tuple.<tspan x="56" dy="36">Wildcards avoid names for components that are not used.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 542–563                                                        22 / 80</text></svg>
