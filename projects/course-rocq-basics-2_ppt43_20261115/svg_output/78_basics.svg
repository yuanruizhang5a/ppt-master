<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">OPTIONAL: TESTING YOUR SOLUTIONS</text><text x="56" y="100" font-size="34" fill="#14324B">Run the chapter’s test script</text></g>
<g id="optional" data-pptx-bounds="48 145 928 165"><text x="56" y="182">This check is optional. If all required exercises are complete<tspan x="56" dy="36">and Rocq accepts them, you are already in good shape.</tspan><tspan x="56" dy="44">Save Basics.v before running BasicsTest.v.</tspan></text></g>
<g id="commands" data-pptx-bounds="48 340 928 190"><text x="56" y="376" font-family="Consolas" font-size="20" xml:space="preserve">rocq compile -Q . LF Basics.v<tspan x="56" dy="32">rocq compile -Q . LF BasicsTest.v</tspan><tspan x="56" dy="46">(* Or, with make installed: *)</tspan><tspan x="56" dy="32">make BasicsTest.vo</tspan></text></g>
<g id="requirements" data-pptx-bounds="48 565 928 130"><text x="56" y="600" font-size="22">The directory must contain _CoqProject with the line -Q . LF.<tspan x="56" dy="36">A deleted or renamed exercise makes the test fail</tspan><tspan x="56" dy="34">with an error naming the missing exercise.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1986–2009                                                      78 / 80</text></svg>
