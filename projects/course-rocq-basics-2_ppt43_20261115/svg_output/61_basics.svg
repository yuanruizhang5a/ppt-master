<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Comparing letters</text></g>
<g id="comparison" data-pptx-bounds="48 140 928 555"><text x="56" y="174" font-family="Consolas" font-size="20" xml:space="preserve">Definition letter_comparison (l1 l2 : letter) : comparison :=<tspan x="56" dy="25">  match l1, l2 with</tspan><tspan x="56" dy="25">  | A, A =&gt; Eq</tspan><tspan x="56" dy="25">  | A, _ =&gt; Gt</tspan><tspan x="56" dy="25">  | B, A =&gt; Lt</tspan><tspan x="56" dy="25">  | B, B =&gt; Eq</tspan><tspan x="56" dy="25">  | B, _ =&gt; Gt</tspan><tspan x="56" dy="25">  | C, (A | B) =&gt; Lt</tspan><tspan x="56" dy="25">  | C, C =&gt; Eq</tspan><tspan x="56" dy="25">  | C, _ =&gt; Gt</tspan><tspan x="56" dy="25">  | D, (A | B | C) =&gt; Lt</tspan><tspan x="56" dy="25">  | D, D =&gt; Eq</tspan><tspan x="56" dy="25">  | D, _ =&gt; Gt</tspan><tspan x="56" dy="25">  | F, (A | B | C | D) =&gt; Lt</tspan><tspan x="56" dy="25">  | F, F =&gt; Eq</tspan><tspan x="56" dy="25">  end.</tspan><tspan x="56" dy="36">Compute letter_comparison B A.  (* ==&gt; Lt *)</tspan><tspan x="56" dy="25">Compute letter_comparison D D.  (* ==&gt; Eq *)</tspan><tspan x="56" dy="25">Compute letter_comparison B F.  (* ==&gt; Gt *)</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1597–1625                                                      61 / 80</text></svg>
