<g id="proof" data-pptx-bounds="48 350 928 265"><text x="56" y="386" font-family="Consolas" font-size="20" xml:space="preserve">Theorem mult_n_0_m_0 : forall p q : nat,<tspan x="56" dy="28">  (p * 0) + (q * 0) = 0.</tspan><tspan x="56" dy="34">Proof.</tspan><tspan x="56" dy="28">  intros p q.</tspan><tspan x="56" dy="28">  rewrite &lt;- mult_n_O.</tspan><tspan x="56" dy="28">  rewrite &lt;- mult_n_O.</tspan><tspan x="56" dy="28">  reflexivity. Qed.</tspan></text></g>
