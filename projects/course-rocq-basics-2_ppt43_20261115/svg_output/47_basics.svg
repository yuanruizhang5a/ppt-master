<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY CASE ANALYSIS</text><text x="56" y="100" font-size="34" fill="#14324B">Nested case analysis</text></g>
<g id="proof" data-pptx-bounds="48 145 928 400"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Theorem andb_commutative :<tspan x="56" dy="28">  forall b c, andb b c = andb c b.</tspan><tspan x="56" dy="36">Proof.</tspan><tspan x="56" dy="28">  intros b c. destruct b eqn:Eb.</tspan><tspan x="56" dy="28">  - destruct c eqn:Ec.</tspan><tspan x="56" dy="28">    + reflexivity.</tspan><tspan x="56" dy="28">    + reflexivity.</tspan><tspan x="56" dy="28">  - destruct c eqn:Ec.</tspan><tspan x="56" dy="28">    + reflexivity.</tspan><tspan x="56" dy="28">    + reflexivity.</tspan><tspan x="56" dy="28">Qed.</tspan></text></g>
<g id="nesting" data-pptx-bounds="48 580 928 110"><text x="56" y="616">Each pair of reflexivity calls closes the two cases of c.<tspan x="56" dy="36">Different bullet shapes distinguish the nesting levels.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1273–1291                                                      47 / 80</text></svg>
