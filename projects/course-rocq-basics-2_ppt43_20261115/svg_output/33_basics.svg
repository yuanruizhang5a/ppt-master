<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Testing equality: eqb</text></g>
<g id="eqb" data-pptx-bounds="48 145 928 395"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Fixpoint eqb (n m : nat) : bool :=<tspan x="56" dy="30">  match n with</tspan><tspan x="56" dy="30">  | O =&gt; match m with</tspan><tspan x="56" dy="30">         | O =&gt; true</tspan><tspan x="56" dy="30">         | S m' =&gt; false</tspan><tspan x="56" dy="30">         end</tspan><tspan x="56" dy="30">  | S n' =&gt; match m with</tspan><tspan x="56" dy="30">            | O =&gt; false</tspan><tspan x="56" dy="30">            | S m' =&gt; eqb n' m'</tspan><tspan x="56" dy="30">            end</tspan><tspan x="56" dy="30">  end.</tspan></text></g>
<g id="meaning" data-pptx-bounds="48 575 928 110"><text x="56" y="614">Even equality testing is user-defined.<tspan x="56" dy="36">These nested matches could also be a simultaneous match.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 852–875                                                        33 / 80</text></svg>
