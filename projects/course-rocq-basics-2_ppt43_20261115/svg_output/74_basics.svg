<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#9A5800">EXERCISE · 2 STARS · STANDARD</text><text x="56" y="100" font-size="34" fill="#14324B">grade_lowered_once</text></g>
<g id="exercise" data-pptx-bounds="48 145 928 350"><text x="56" y="184" font-family="Consolas" font-size="20" xml:space="preserve">Theorem grade_lowered_once :<tspan x="56" dy="34">  forall (late_days : nat) (g : grade),</tspan><tspan x="56" dy="34">    (late_days &lt;? 9 = false) -&gt;</tspan><tspan x="56" dy="34">    (late_days &lt;? 17 = true) -&gt;</tspan><tspan x="56" dy="34">    (apply_late_policy late_days g) = (lower_grade g).</tspan><tspan x="56" dy="44">Proof.</tspan><tspan x="56" dy="34">  (* FILL IN HERE *) Admitted.</tspan><tspan x="56" dy="44">End LateDays.</tspan></text></g>
<g id="meaning" data-pptx-bounds="48 535 928 145"><text x="56" y="572">Between 9 and 16 late days, the grade is lowered one step.<tspan x="56" dy="44">The source’s exercise label is “graded_lowered_once”;</tspan><tspan x="56" dy="36">the theorem identifier is grade_lowered_once.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1896–1908                                                      74 / 80</text></svg>
