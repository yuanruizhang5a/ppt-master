<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Comparing modifiers</text></g>
<g id="code" data-pptx-bounds="48 145 928 420"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Definition modifier_comparison (m1 m2 : modifier)<tspan x="56" dy="30">  : comparison :=</tspan><tspan x="56" dy="30">  match m1, m2 with</tspan><tspan x="56" dy="30">  | Plus, Plus =&gt; Eq</tspan><tspan x="56" dy="30">  | Plus, _ =&gt; Gt</tspan><tspan x="56" dy="30">  | Natural, Plus =&gt; Lt</tspan><tspan x="56" dy="30">  | Natural, Natural =&gt; Eq</tspan><tspan x="56" dy="30">  | Natural, _ =&gt; Gt</tspan><tspan x="56" dy="30">  | Minus, (Plus | Natural) =&gt; Lt</tspan><tspan x="56" dy="30">  | Minus, Minus =&gt; Eq</tspan><tspan x="56" dy="30">  end.</tspan></text></g>
<g id="order" data-pptx-bounds="48 605 928 80"><text x="56" y="645">The intended order is Plus &gt; Natural &gt; Minus.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1633–1646                                                      63 / 80</text></svg>
