<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Lowering a letter</text></g>
<g id="lower-letter" data-pptx-bounds="48 145 928 340"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Definition lower_letter (l : letter) : letter :=<tspan x="56" dy="32">  match l with</tspan><tspan x="56" dy="32">  | A =&gt; B</tspan><tspan x="56" dy="32">  | B =&gt; C</tspan><tspan x="56" dy="32">  | C =&gt; D</tspan><tspan x="56" dy="32">  | D =&gt; F</tspan><tspan x="56" dy="32">  | F =&gt; F  (* Can't go lower than F! *)</tspan><tspan x="56" dy="32">  end.</tspan></text></g>
<g id="boundary" data-pptx-bounds="48 525 928 160"><text x="56" y="564">F is the lowest possible letter, so it remains unchanged.<tspan x="56" dy="48">Does lower_letter always return a strictly lower letter?</tspan><tspan x="56" dy="36">The next source example tests that proposed claim.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1685–1704                                                      65 / 80</text></svg>
