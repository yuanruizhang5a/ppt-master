<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NEW TYPES FROM OLD</text><text x="56" y="100" font-size="34" fill="#14324B">What the constructors generate</text></g>
<g id="closure" data-pptx-bounds="48 145 928 230"><text x="56" y="184">rgb contains red, green, and blue.<tspan x="56" dy="42">color contains black, white, and primary p for each p : rgb.</tspan><tspan x="56" dy="42">Only constructor expressions formed in these ways belong.</tspan><tspan x="56" dy="42">Pattern matching defines functions on the resulting values.</tspan></text></g>
<g id="monochrome" data-pptx-bounds="48 410 928 260"><text x="56" y="450" font-family="Consolas" font-size="20" xml:space="preserve">Definition monochrome (c : color) : bool :=<tspan x="56" dy="30">  match c with</tspan><tspan x="56" dy="30">  | black =&gt; true</tspan><tspan x="56" dy="30">  | white =&gt; true</tspan><tspan x="56" dy="30">  | primary p =&gt; false</tspan><tspan x="56" dy="30">  end.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 450–480                                                        18 / 80</text></svg>
