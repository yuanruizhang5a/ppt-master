<g id="example" data-pptx-bounds="48 145 928 210"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Example test_next_working_day:<tspan x="56" dy="28">  (next_working_day (next_working_day saturday)) = tuesday.</tspan><tspan x="56" dy="38">Proof. simpl. reflexivity. Qed.</tspan></text><text x="56" y="308">A named assertion is checked: both sides evaluate equally.</text></g>
<g id="extraction" data-pptx-bounds="48 380 928 310"><text x="56" y="416">Extraction produces an OCaml, Scheme, or Haskell program<tspan x="56" dy="36">from a Gallina definition for efficient compilation.</tspan><tspan x="56" dy="42">This trusts extraction and the target-language compiler.</tspan><tspan x="56" dy="48">The chapter also imports strings for grading infrastructure:</tspan></text><text x="56" y="620" font-family="Consolas" font-size="20">From Stdlib Require Export String.</text></g>
