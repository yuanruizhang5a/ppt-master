<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY SIMPLIFICATION</text><text x="56" y="100" font-size="34" fill="#14324B">From examples to general properties</text></g>
<g id="proofs" data-pptx-bounds="48 145 928 290"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Example plus_1_1 : 1 + 1 = 2.<tspan x="56" dy="32">Proof. simpl. reflexivity. Qed.</tspan><tspan x="56" dy="60">Theorem plus_O_n : forall n : nat, 0 + n = n.</tspan><tspan x="56" dy="32">Proof.</tspan><tspan x="56" dy="32">  intros n. simpl. reflexivity.</tspan><tspan x="56" dy="32">Qed.</tspan></text></g>
<g id="meaning" data-pptx-bounds="48 465 928 220"><text x="56" y="504">simpl reduces both sides; reflexivity checks equality.<tspan x="56" dy="44">0 + n reduces to n whatever n is, directly from plus.</tspan><tspan x="56" dy="44">forall makes the statement general.</tspan><tspan x="56" dy="36">HTML renders this quantifier as ∀.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 934–964 · Proof by Simplification                            36 / 80</text></svg>
