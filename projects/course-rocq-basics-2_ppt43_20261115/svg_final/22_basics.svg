<g id="all-zero" data-pptx-bounds="48 145 928 400"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Definition all_zero (nb : nybble) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="208">  match nb with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="236">  | (bits B0 B0 B0 B0) =&gt; true</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="264">  | (bits _ _ _ _) =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="292">  end.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="334">Compute (all_zero (bits B1 B0 B1 B0)).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="362">(* ===&gt; false : bool *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="400">Compute (all_zero (bits B0 B0 B0 B0)).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="428">(* ===&gt; true : bool *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="466">End TuplePlayground.</text></g>
<g id="wildcard" data-pptx-bounds="48 580 928 100"><text x="56" y="620">Pattern matching unwraps the tuple.</text><text x="56" y="656">Wildcards avoid names for components that are not used.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 542–563                                                        22 / 80</text></svg>