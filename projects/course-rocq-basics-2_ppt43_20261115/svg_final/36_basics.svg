<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY SIMPLIFICATION</text><text x="56" y="100" font-size="34" fill="#14324B">From examples to general properties</text></g>
<g id="proofs" data-pptx-bounds="48 145 928 290"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Example plus_1_1 : 1 + 1 = 2.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">Proof. simpl. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="272">Theorem plus_O_n : forall n : nat, 0 + n = n.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="304">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="336">  intros n. simpl. reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="368">Qed.</text></g>
<g id="meaning" data-pptx-bounds="48 465 928 220"><text x="56" y="504">simpl reduces both sides; reflexivity checks equality.</text><text x="56" y="548">0 + n reduces to n whatever n is, directly from plus.</text><text x="56" y="592">forall makes the statement general.</text><text x="56" y="628">HTML renders this quantifier as ∀.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 934–964 · Proof by Simplification                            36 / 80</text></svg>