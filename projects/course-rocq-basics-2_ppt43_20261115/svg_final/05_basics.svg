<g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS</text><text x="56" y="100" font-size="34" fill="#14324B">Enumerated Types</text></g>
<g id="small-core" data-pptx-bounds="48 145 928 210"><text x="56" y="190">Rocq has an extremely small set of built-in features.</text><text x="56" y="232">A powerful datatype mechanism defines new types</text><text x="56" y="268">from scratch, including familiar booleans and numbers.</text></g>
<g id="library" data-pptx-bounds="48 390 928 260"><text x="56" y="430">The standard library supplies booleans, numbers,</text><text x="56" y="466">lists, hash tables, and other common structures.</text><text x="56" y="520">There is nothing primitive or magical about those definitions.</text><text x="56" y="574">This course rebuilds almost all the definitions it needs</text><text x="56" y="610">to make that foundation explicit.</text></g>
