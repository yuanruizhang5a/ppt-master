<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Testing equality: eqb</text></g>
<g id="eqb" data-pptx-bounds="48 145 928 395"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Fixpoint eqb (n m : nat) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="210">  match n with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="240">  | O =&gt; match m with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="270">         | O =&gt; true</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="300">         | S m' =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="330">         end</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="360">  | S n' =&gt; match m with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="390">            | O =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="420">            | S m' =&gt; eqb n' m'</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="450">            end</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="480">  end.</text></g>
<g id="meaning" data-pptx-bounds="48 575 928 110"><text x="56" y="614">Even equality testing is user-defined.</text><text x="56" y="650">These nested matches could also be a simultaneous match.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 852–875                                                        33 / 80</text></svg>