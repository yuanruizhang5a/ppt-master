<g id="task" data-pptx-bounds="48 140 928 135"><text font-size="22" x="56" y="174">Lexicographic order: compare letters first; only when equal</text><text font-size="22" x="56" y="208">compare modifiers. Every A grade is above every B grade.</text><text font-size="22" x="56" y="242">Hint: match grades, then letter_comparison; just three outcomes.</text></g>
<g id="exercise" data-pptx-bounds="48 295 928 405"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="324">Definition grade_comparison (g1 g2 : grade) : comparison.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="350">Admitted.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="384">Example test_grade_comparison1 :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="410">  (grade_comparison (Grade A Minus) (Grade B Plus)) = Gt.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="436">Admitted.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="468">Example test_grade_comparison2 :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="494">  (grade_comparison (Grade A Minus) (Grade A Plus)) = Lt.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="520">Admitted.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="552">Example test_grade_comparison3 :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="578">  (grade_comparison (Grade F Plus) (Grade F Plus)) = Eq.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="604">Admitted.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="636">Example test_grade_comparison4 :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="662">  (grade_comparison (Grade B Minus) (Grade C Plus)) = Gt.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="688">Admitted.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1647–1684                                                      64 / 80</text></svg>