<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#9A5800">EXERCISE · 1 STAR · STANDARD</text><text x="56" y="100" font-size="34" fill="#14324B">plus_id_exercise</text></g>
<g id="exercise" data-pptx-bounds="48 145 928 235"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Theorem plus_id_exercise : forall n m o : nat,</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">  n = m -&gt; m = o -&gt; n + m = m + o.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="254">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="286">  (* FILL IN HERE *) Admitted.</text></g>
<g id="admitted" data-pptx-bounds="48 415 928 270"><text x="56" y="452">There are two hypotheses to introduce: n = m and m = o.</text><text x="56" y="500">Admitted accepts a claim without proving it.</text><text x="56" y="542">It can temporarily support a larger proof while lemmas</text><text x="56" y="578">are being developed, then be replaced by real proofs.</text><text x="56" y="626">Each admission leaves an unchecked assumption.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1085–1112                                                      40 / 80</text></svg>