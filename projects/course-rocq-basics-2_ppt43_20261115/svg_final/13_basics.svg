<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · BOOLEANS</text><text x="56" y="100" font-size="34" fill="#14324B">Conditionals on another type</text></g>
<g id="bw-example" data-pptx-bounds="48 145 928 415"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="182">Inductive bw : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">  | bw_black</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="242">  | bw_white.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="290">Definition invert (x: bw) : bw :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="320">  if x then bw_white else bw_black.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="368">Compute (invert bw_black).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="398">(* ==&gt; bw_white : bw *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="440">Compute (invert bw_white).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="470">(* ==&gt; bw_black : bw *)</text></g>
<g id="meaning" data-pptx-bounds="48 590 928 90"><text x="56" y="630">The constructor order determines the conditional branches.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 309–327                                                        13 / 80</text></svg>