<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY REWRITING</text><text x="56" y="100" font-size="34" fill="#14324B">Rewriting with existing theorems</text></g>
<g id="lemmas" data-pptx-bounds="48 145 928 180"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Check mult_n_O.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="208">(* ===&gt; forall n : nat, 0 = n * 0 *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="250">Check mult_n_Sm.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="278">(* ===&gt; forall n m : nat, n * m + n = n * S m *)</text></g>
<g id="proof" data-pptx-bounds="48 350 928 265"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="386">Theorem mult_n_0_m_0 : forall p q : nat,</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="414">  (p * 0) + (q * 0) = 0.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="448">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="476">  intros p q.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="504">  rewrite &lt;- mult_n_O.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="532">  rewrite &lt;- mult_n_O.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="560">  reflexivity. Qed.</text></g>
<g id="instantiation" data-pptx-bounds="48 635 928 60"><text x="56" y="668" font-size="22">Rocq matches a theorem’s quantified variables against the goal.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1113–1136                                                      41 / 80</text></svg>