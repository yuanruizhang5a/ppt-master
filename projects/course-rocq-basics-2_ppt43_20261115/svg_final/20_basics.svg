<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS</text><text x="56" y="100" font-size="34" fill="#14324B">Modules</text></g>
<g id="module" data-pptx-bounds="48 145 928 320"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="184">Module Playground.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="216">  Definition foo : rgb := blue.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="248">End Playground.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="296">Definition foo : bool := true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="344">Check Playground.foo : rgb.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="376">Check foo : bool.</text></g>
<g id="scope" data-pptx-bounds="48 500 928 180"><text x="56" y="540">Modules organize declarations and limit their scope.</text><text x="56" y="582">After End Playground, its declaration is Playground.foo.</text><text x="56" y="624">This lets the chapter reuse names without interference.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 500–519 · Modules                                              20 / 80</text></svg>