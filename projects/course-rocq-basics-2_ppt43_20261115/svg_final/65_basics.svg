<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Lowering a letter</text></g>
<g id="lower-letter" data-pptx-bounds="48 145 928 340"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Definition lower_letter (l : letter) : letter :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">  match l with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="244">  | A =&gt; B</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="276">  | B =&gt; C</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="308">  | C =&gt; D</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="340">  | D =&gt; F</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="372">  | F =&gt; F  (* Can't go lower than F! *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="404">  end.</text></g>
<g id="boundary" data-pptx-bounds="48 525 928 160"><text x="56" y="564">F is the lowest possible letter, so it remains unchanged.</text><text x="56" y="612">Does lower_letter always return a strictly lower letter?</text><text x="56" y="648">The next source example tests that proposed claim.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1685–1704                                                      65 / 80</text></svg>