<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Recursive addition</text></g>
<g id="definition" data-pptx-bounds="48 145 928 265"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Module NatPlayground2.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="214">Fixpoint plus (n : nat) (m : nat) : nat :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="242">  match n with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="270">  | O =&gt; m</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="298">  | S n' =&gt; S (plus n' m)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="326">  end.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="360">Compute (plus 3 2).  (* ===&gt; 5 : nat *)</text></g>
<g id="reduction" data-pptx-bounds="48 440 928 250"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="474">plus (S (S (S O))) (S (S O))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="506">==&gt; S (plus (S (S O)) (S (S O)))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="538">==&gt; S (S (plus (S O) (S (S O))))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="570">==&gt; S (S (S (plus O (S (S O)))))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="602">==&gt; S (S (S (S (S O))))</text><text x="56" y="665" font-size="22">Use the successor clause three times, then the zero clause.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 740–771                                                        28 / 80</text></svg>