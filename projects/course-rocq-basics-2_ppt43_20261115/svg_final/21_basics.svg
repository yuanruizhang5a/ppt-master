<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS</text><text x="56" y="100" font-size="34" fill="#14324B">Tuples</text></g>
<g id="tuple" data-pptx-bounds="48 145 928 350"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Module TuplePlayground.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="224">Inductive bit : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="252">  | B1</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="280">  | B0.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="324">Inductive nybble : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="352">  | bits (b0 b1 b2 b3 : bit).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="396">Check (bits B1 B0 B1 B0) : nybble.</text></g>
<g id="meaning" data-pptx-bounds="48 525 928 160"><text x="56" y="562">One constructor with several parameters forms a tuple type.</text><text x="56" y="604">A nybble is four bits: half a byte.</text><text x="56" y="646">The bits constructor wraps those four components.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 520–541 · Tuples                                               21 / 80</text></svg>