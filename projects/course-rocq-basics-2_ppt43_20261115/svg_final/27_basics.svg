<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Recursion: even and odd</text></g>
<g id="code" data-pptx-bounds="48 145 928 400"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Fixpoint even (n:nat) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="208">  match n with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="236">  | O        =&gt; true</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="264">  | S O      =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="292">  | S (S n') =&gt; even n'</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="320">  end.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="360">Definition odd (n:nat) : bool := negb (even n).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="400">Example test_odd1: odd 1 = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="426">Proof. simpl. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="460">Example test_odd2: odd 4 = false.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="486">Proof. simpl. reflexivity. Qed.</text></g>
<g id="recursion" data-pptx-bounds="48 580 928 105"><text font-size="22" x="56" y="614">Recursion uses Fixpoint; odd reuses even in a Definition.</text><text font-size="22" x="56" y="648">In these tests, reflexivity can do the work without simpl.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 712–739                                                        27 / 80</text></svg>