<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY SIMPLIFICATION</text><text x="56" y="100" font-size="34" fill="#14324B">More simplification proofs</text></g>
<g id="proofs" data-pptx-bounds="48 145 928 310"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Theorem plus_O_n'' : forall n : nat, 0 + n = n.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">Proof. intros m. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="264">Theorem plus_1_l : forall n:nat, 1 + n = S n.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="296">Proof. intros n. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="348">Theorem mult_0_l : forall n:nat, 0 * n = 0.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="380">Proof. intros n. reflexivity. Qed.</text></g>
<g id="notes" data-pptx-bounds="48 490 928 195"><text x="56" y="530">intros can choose a different variable name.</text><text x="56" y="572">intros, simpl, and reflexivity are tactics between Proof and Qed.</text><text x="56" y="614">The suffix _l means “on the left”. Step through the proofs;</text><text x="56" y="650">add simpl to observe how the context and goal change.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1007–1038                                                      38 / 80</text></svg>