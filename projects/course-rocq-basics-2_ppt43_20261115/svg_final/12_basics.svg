<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · BOOLEANS</text><text x="56" y="100" font-size="34" fill="#14324B">Conditional expressions</text></g>
<g id="definitions" data-pptx-bounds="48 145 928 330"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Definition negb' (b:bool) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="210">  if b then false else true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="262">Definition andb' (b1:bool) (b2:bool) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="292">  if b1 then b2 else false.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="344">Definition orb' (b1:bool) (b2:bool) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="374">  if b1 then true else b2.</text></g>
<g id="generalization" data-pptx-bounds="48 505 928 180"><text x="56" y="540">Conditionals work for any inductive type with two clauses.</text><text x="56" y="582">The first constructor selects the then branch;</text><text x="56" y="618">the second selects the else branch.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 282–308                                                        12 / 80</text></svg>