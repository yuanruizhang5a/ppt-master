<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">An edge case invalidates a theorem</text></g>
<g id="attempt" data-pptx-bounds="48 145 928 335"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="178">Theorem lower_letter_lowers: forall (l : letter),</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="204">  letter_comparison (lower_letter l) l = Lt.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="234">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="260">  intros l. destruct l.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="286">  - simpl. reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="312">  - simpl. reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="338">  - simpl. reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="364">  - simpl. reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="390">  - simpl. (* We get stuck here. *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="416">Abort.</text></g>
<g id="edge-case" data-pptx-bounds="48 510 928 185"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="544">Theorem lower_letter_F_is_F: lower_letter F = F.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="574">Proof. simpl. reflexivity. Qed.</text><text font-size="22" x="56" y="632">The claim fails at F: its lowered result is equal, not less.</text><text font-size="22" x="56" y="666">The corrected theorem must exclude this boundary case.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1705–1729                                                      66 / 80</text></svg>