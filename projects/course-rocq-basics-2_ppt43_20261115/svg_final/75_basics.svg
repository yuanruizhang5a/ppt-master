<g id="representations" data-pptx-bounds="48 140 928 340"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="174">0: Z                      unary O</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="204">1: B1 Z                   unary S O</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="234">2: B0 (B1 Z)              unary S (S O)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="264">3: B1 (B1 Z)              unary S (S (S O))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="294">4: B0 (B0 (B1 Z))         unary S (S (S (S O)))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="324">5: B1 (B0 (B1 Z))         unary S (S (S (S (S O))))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="354">6: B0 (B1 (B1 Z))         unary S (S (S (S (S (S O)))))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="384">7: B1 (B1 (B1 Z))         unary S (S (S (S (S (S (S O))))))</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="414">8: B0 (B0 (B0 (B1 Z)))    unary S (S (S (S (S (S (S (S O)))))))</text></g>
<g id="bit-order" data-pptx-bounds="48 515 928 180"><text x="56" y="552">The low-order bit is on the left, the high-order bit on the right.</text><text x="56" y="592">This is the reverse of customary binary notation.</text><text x="56" y="638">Source comprehension check:</text><text x="56" y="674">What unary numeral does B0 Z represent?</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1909–1938                                                      75 / 80</text></svg>