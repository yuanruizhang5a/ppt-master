<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY CASE ANALYSIS</text><text x="56" y="100" font-size="34" fill="#14324B">Braces instead of bullets</text></g>
<g id="proof" data-pptx-bounds="48 145 928 400"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Theorem andb_commutative' :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="208">  forall b c, andb b c = andb c b.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="244">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="272">  intros b c. destruct b eqn:Eb.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="300">  { destruct c eqn:Ec.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="328">    { reflexivity. }</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="356">    { reflexivity. } }</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="384">  { destruct c eqn:Ec.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="412">    { reflexivity. }</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="440">    { reflexivity. } }</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="468">Qed.</text></g>
<g id="braces" data-pptx-bounds="48 580 928 115"><text font-size="22" x="56" y="616">Braces mark both the beginning and end of each subproof.</text><text font-size="22" x="56" y="650">Use -, +, *, repeated bullets, braces, or a combination.</text><text font-size="22" x="56" y="684">Braces allow the same bullet shapes at multiple levels.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1292–1310                                                      48 / 80</text></svg>