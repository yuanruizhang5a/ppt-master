<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NEW TYPES FROM OLD</text><text x="56" y="100" font-size="34" fill="#14324B">Matching constructor arguments</text></g>
<g id="isred" data-pptx-bounds="48 145 928 310"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="184">Definition isred (c : color) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="216">  match c with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="248">  | black =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="280">  | white =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="312">  | primary red =&gt; true</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="344">  | primary _ =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="376">  end.</text></g>
<g id="patterns" data-pptx-bounds="48 485 928 200"><text x="56" y="524">A pattern for primary must include its argument.</text><text x="56" y="566">Use a variable, a suitable constant, or the wildcard _.</text><text x="56" y="608">After the red branch, primary _ covers the other rgb values.</text><text x="56" y="644">The wildcard has the same effect as an unused variable p.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 481–499                                                        19 / 80</text></svg>