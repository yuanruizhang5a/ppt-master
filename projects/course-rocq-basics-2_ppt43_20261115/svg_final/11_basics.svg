<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · BOOLEANS</text><text x="56" y="100" font-size="34" fill="#14324B">Boolean tests and notation</text></g>
<g id="tests" data-pptx-bounds="48 145 928 405"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Example test_orb1: (orb true false) = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="206">Proof. simpl. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="238">Example test_orb2: (orb false false) = false.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="264">Proof. simpl. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="296">Example test_orb3: (orb false true) = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="322">Proof. simpl. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="354">Example test_orb4: (orb true true) = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="380">Proof. simpl. reflexivity. Qed.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="418">Notation "x &amp;&amp; y" := (andb x y).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="444">Notation "x || y" := (orb x y).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="476">Example test_orb5: false || false || true = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="502">Proof. simpl. reflexivity. Qed.</text></g>
<g id="notation-note" data-pptx-bounds="48 580 928 110"><text font-size="22" x="56" y="616">The first four tests form the complete truth table for orb.</text><text font-size="22" x="56" y="650">Square brackets mark code in .v comments; HTML uses a code font.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 251–281                                                        11 / 80</text></svg>