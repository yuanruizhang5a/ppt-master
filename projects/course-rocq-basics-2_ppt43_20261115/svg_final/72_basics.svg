<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Exposing a definition for rewriting</text></g>
<g id="unfold" data-pptx-bounds="48 145 928 380"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Theorem apply_late_policy_unfold :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="210">  forall (late_days : nat) (g : grade),</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="240">    (apply_late_policy late_days g)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="270">    =</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="300">    (if late_days &lt;? 9 then g else</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="330">       if late_days &lt;? 17 then lower_grade g</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="360">       else if late_days &lt;? 21 then lower_grade (lower_grade g)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="390">            else lower_grade (lower_grade (lower_grade g))).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="430">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="460">  intros. reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="490">Qed.</text></g>
<g id="purpose" data-pptx-bounds="48 565 928 120"><text x="56" y="604">reflexivity proves the definition equals its own body.</text><text x="56" y="644">This equality lets rewrite expose that body in later proofs.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1856–1882                                                      72 / 80</text></svg>