<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY SIMPLIFICATION</text><text x="56" y="100" font-size="34" fill="#14324B">What reflexivity can do</text></g>
<g id="proof" data-pptx-bounds="48 145 928 150"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="182">Theorem plus_O_n' : forall n : nat, 0 + n = n.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="216">Proof. intros n. reflexivity. Qed.</text></g>
<g id="tactic-meaning" data-pptx-bounds="48 325 928 365"><text x="56" y="362">reflexivity simplifies automatically and may unfold definitions.</text><text x="56" y="404">When it succeeds, the goal is finished.</text><text x="56" y="452">simpl exposes an intermediate goal for us to inspect;</text><text x="56" y="488">it avoids blindly expanding everything into a messy expression.</text><text x="56" y="536">Theorem, Example, Lemma, Fact, and Remark are synonyms</text><text x="56" y="572">for this purpose; the choice communicates style.</text><text x="56" y="620">intros n moves the quantified variable into the context.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 965–1006                                                       37 / 80</text></svg>