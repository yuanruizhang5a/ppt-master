<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY CASE ANALYSIS</text><text x="56" y="100" font-size="34" fill="#14324B">Negation is involutive</text></g>
<g id="proof" data-pptx-bounds="48 145 928 280"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Theorem negb_involutive : forall b : bool,</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">  negb (negb b) = b.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="252">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="284">  intros b. destruct b eqn:E.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="316">  - reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="348">  - reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="380">Qed.</text></g>
<g id="explanation" data-pptx-bounds="48 460 928 220"><text x="56" y="500">destruct works for any inductively defined datatype.</text><text x="56" y="542">Boolean negation is its own inverse.</text><text x="56" y="590">No as clause is needed here: neither boolean constructor</text><text x="56" y="626">has arguments to name. In general, choose names explicitly;</text><text x="56" y="662">automatically chosen names can be confusing.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1250–1272                                                      46 / 80</text></svg>