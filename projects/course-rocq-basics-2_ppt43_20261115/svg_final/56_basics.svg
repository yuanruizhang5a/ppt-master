<g id="exercise" data-pptx-bounds="48 290 928 300"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="330">Theorem identity_fn_applied_twice :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="364">  forall (f : bool -&gt; bool),</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="398">  (forall (x : bool), f x = x) -&gt;</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="432">  forall (b : bool), f (f b) = b.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="476">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="510">  (* FILL IN HERE *) Admitted.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1482–1500 · More Exercises / Warmups                         56 / 80</text></svg>