<g id="exp" data-pptx-bounds="48 445 928 245"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="480">Fixpoint exp (base power : nat) : nat :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="510">  match power with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="540">  | O =&gt; S O</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="570">  | S p =&gt; mult base (exp base p)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="600">  end.</text><text x="56" y="661" font-size="22">A comma allows matching two expressions simultaneously.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 787–804                                                        30 / 80</text></svg>