<g id="exercise" data-pptx-bounds="48 145 928 205"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Theorem andb_true_elim2 : forall b c : bool,</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">  andb b c = true -&gt; c = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="252">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="284">  (* FILL IN HERE *) Admitted.</text></g>
<g id="hints" data-pptx-bounds="48 390 928 295"><text x="56" y="430">Mark cases and subcases with bullets.</text><text x="56" y="478">Hint 1: simpl in H simplifies a hypothesis.</text><text x="56" y="526">Hint 2: You will need both booleans. Simplify the hypothesis</text><text x="56" y="562">before destructing the second one.</text><text x="56" y="610">Hint 3: If hypotheses contradict one another, consider</text><text x="56" y="646">how to rewrite using that contradiction.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1331–1353                                                      50 / 80</text></svg>