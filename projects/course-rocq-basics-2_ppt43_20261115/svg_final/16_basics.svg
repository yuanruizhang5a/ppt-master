<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS</text><text x="56" y="100" font-size="34" fill="#14324B">Types</text></g>
<g id="checks" data-pptx-bounds="48 145 928 280"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="184">Check true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="214">(* ===&gt; true : bool *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="258">Check true : bool.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="288">Check (negb true) : bool.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="332">Check negb : bool -&gt; bool.</text></g>
<g id="explanation" data-pptx-bounds="48 455 928 235"><text x="56" y="490">Every expression has a type describing what it computes.</text><text x="56" y="530">Check prints the type; a type annotation asks Rocq to verify it.</text><text x="56" y="578">Functions are values too. bool → bool maps a boolean</text><text x="56" y="614">to a boolean; bool → bool → bool takes two boolean inputs.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 381–413 · Types                                                16 / 80</text></svg>