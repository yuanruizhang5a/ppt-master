<g id="day-type" data-pptx-bounds="48 145 928 330"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="186">Inductive day : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="216">  | monday</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="246">  | tuesday</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="276">  | wednesday</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="306">  | thursday</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="336">  | friday</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="366">  | saturday</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="396">  | sunday.</text></g>
<g id="interpretation" data-pptx-bounds="48 505 928 175"><text x="56" y="550">This declaration defines a type named day.</text><text x="56" y="592">Its members are monday, tuesday, …, sunday.</text><text x="56" y="634">Functions can now operate on these values.</text></g>
