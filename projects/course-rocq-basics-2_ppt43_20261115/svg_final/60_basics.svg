<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Comparison and pattern abbreviations</text></g>
<g id="comparison" data-pptx-bounds="48 145 928 180"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Inductive comparison : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="210">  | Eq   (* equal *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="240">  | Lt   (* less than *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="270">  | Gt.  (* greater than *)</text></g>
<g id="patterns" data-pptx-bounds="48 350 928 345"><text font-size="22" x="56" y="386">A three-way result carries more information than a boolean.</text><text font-size="22" x="56" y="424">A simultaneous match abbreviates nested matching:</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="478">match l1, l2 with    (* shorthand for nested matches *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="506">| A, A =&gt; Eq</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="534">| A, _ =&gt; Gt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="562">end</text><text x="56" y="635" font-size="22">Alternative pattern C, (A | B) covers both C, A and C, B.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1561–1596                                                      60 / 80</text></svg>