<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE ON NOTATION · OPTIONAL</text><text x="56" y="100" font-size="34" fill="#14324B">Precedence, associativity, and scopes</text></g>
<g id="notation" data-pptx-bounds="48 145 928 210"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Notation "x + y" := (plus x y)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="208">  (at level 50, left associativity) : nat_scope.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="246">Notation "x * y" := (mult x y)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="274">  (at level 40, left associativity) : nat_scope.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="312">1+2*3*4     parses as     1+((2*3)*4)</text></g>
<g id="details" data-pptx-bounds="48 380 928 320"><text font-size="22" x="56" y="416">Precedence levels range from 0 to 100.</text><text font-size="22" x="56" y="450">Associativity may be left, right, or no associativity.</text><text font-size="22" x="56" y="494">Context often identifies the scope: S (O*O) uses nat_scope;</text><text font-size="22" x="56" y="528">the pair type bool*bool uses type_scope.</text><text font-size="22" x="56" y="572">(x*y)%nat makes the intended scope explicit.</text><text font-size="22" x="56" y="606">0%nat means O; 0%Z means the integer zero.</text><text font-size="22" x="56" y="650">Optional sections may be skimmed on a first reading.</text><text font-size="22" x="56" y="684">The source cautions that the notation mechanism is limited.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1396–1441                                                      53 / 80</text></svg>