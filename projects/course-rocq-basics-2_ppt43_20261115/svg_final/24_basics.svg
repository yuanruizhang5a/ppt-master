<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Unary natural numbers</text></g>
<g id="nat" data-pptx-bounds="48 145 928 220"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Module NatPlayground.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="214">Inductive nat : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="244">  | O</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="274">  | S (n : nat).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="316">0: O      1: S O      2: S (S O)      ...</text></g>
<g id="rules" data-pptx-bounds="48 395 928 290"><text x="56" y="434">O is the letter O, representing zero.</text><text x="56" y="474">If n is a natural number, S n is a natural number.</text><text x="56" y="514">Only expressions built by these two rules belong to nat.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="590">Not nat: true   andb true false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="622">         S (S false)   O (O (O S))</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 603–640                                                        24 / 80</text></svg>