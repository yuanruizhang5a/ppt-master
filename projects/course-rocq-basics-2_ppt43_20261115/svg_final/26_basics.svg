<g id="code" data-pptx-bounds="48 145 928 360"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Check (S (S (S (S O)))).  (* ===&gt; 4 : nat *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="222">Definition minustwo (n : nat) : nat :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="250">  match n with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="278">  | O =&gt; O</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="306">  | S O =&gt; O</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="334">  | S (S n') =&gt; n'</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="362">  end.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="400">Compute (minustwo 4).  (* ===&gt; 2 : nat *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="438">Check S        : nat -&gt; nat.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="464">Check pred     : nat -&gt; nat.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="490">Check minustwo : nat -&gt; nat.</text></g>
<g id="distinction" data-pptx-bounds="48 545 928 145"><text x="56" y="580">Decimal numerals are parsing and printing conveniences.</text><text x="56" y="618">S builds a representation; pred and minustwo have</text><text x="56" y="654">computation rules. Applying S itself performs no computation.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 671–711                                                        26 / 80</text></svg>