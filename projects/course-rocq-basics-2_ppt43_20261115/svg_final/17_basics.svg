<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS</text><text x="56" y="100" font-size="34" fill="#14324B">New Types from Old</text></g>
<g id="types" data-pptx-bounds="48 145 928 240"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Inductive rgb : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="210">  | red | green | blue.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="254">Inductive color : Type :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="284">  | black | white</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="314">  | primary (p : rgb).</text></g>
<g id="constructors" data-pptx-bounds="48 420 928 270"><text x="56" y="456">Inductive introduces constructors and groups them into a type.</text><text x="56" y="500">A constructor expression must obey argument counts and types.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="570">Valid:    red      true      primary red</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="612">Invalid:  red primary   true red   primary (primary red)</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 414–449 · New Types from Old                                 17 / 80</text></svg>