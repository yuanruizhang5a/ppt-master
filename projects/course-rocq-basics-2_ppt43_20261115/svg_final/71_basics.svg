<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">A concrete late-days policy</text></g>
<g id="policy" data-pptx-bounds="48 145 928 215"><text x="56" y="182">0–8 late days: no penalty.</text><text x="56" y="222">9–16: lower one step (A+ → A → A− → B+, etc.).</text><text x="56" y="262">17–20: lower two steps.</text><text x="56" y="302">21 or more: lower three steps, a whole letter.</text></g>
<g id="definition" data-pptx-bounds="48 395 928 280"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="430">Definition apply_late_policy (late_days : nat) (g : grade)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="458">  : grade :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="486">  if late_days &lt;? 9 then g</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="514">  else if late_days &lt;? 17 then lower_grade g</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="542">  else if late_days &lt;? 21 then lower_grade (lower_grade g)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="570">  else lower_grade (lower_grade (lower_grade g)).</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1838–1855                                                      71 / 80</text></svg>