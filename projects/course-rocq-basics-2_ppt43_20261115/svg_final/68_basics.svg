<g id="task" data-pptx-bounds="48 140 928 210"><text font-size="22" x="56" y="174">Lower a grade by one step; keep Grade F Minus unchanged.</text><text font-size="22" x="56" y="212">Hint: use lower_letter and nested pattern matching.</text><text font-size="22" x="56" y="246">The outer match should consider only the modifier.</text><text font-size="22" x="56" y="280">Do not enumerate every letter/modifier case.</text><text font-size="22" x="56" y="314">The source notes that its solution is under 10 lines.</text></g>
<g id="exercise" data-pptx-bounds="48 380 928 310"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="412">Definition lower_grade (g : grade) : grade. Admitted.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="454">Example lower_grade_A_Plus :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="482">  lower_grade (Grade A Plus) = (Grade A Natural).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="510">Proof. (* FILL IN HERE *) Admitted.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="552">Example lower_grade_A_Natural :</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="580">  lower_grade (Grade A Natural) = (Grade A Minus).</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="608">Proof. (* FILL IN HERE *) Admitted.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1743–1772                                                      68 / 80</text></svg>