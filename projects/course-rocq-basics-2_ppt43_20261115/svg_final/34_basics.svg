<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Ordering: leb and boolean comparison</text></g>
<g id="code" data-pptx-bounds="48 140 928 430"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="170">Fixpoint leb (n m : nat) : bool :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="195">  match n with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="220">  | O =&gt; true</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="245">  | S n' =&gt; match m with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="270">            | O =&gt; false</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="295">            | S m' =&gt; leb n' m'</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="320">            end</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="345">  end.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="377">Example test_leb1: leb 2 2 = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="402">Example test_leb2: leb 2 4 = true.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="427">Example test_leb3: leb 4 2 = false.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="459">Notation "x =? y" := (eqb x y) (at level 70) : nat_scope.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="484">Notation "x &lt;=? y" := (leb x y) (at level 70) : nat_scope.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="516">Example test_leb3': (4 &lt;=? 2) = false.</text></g>
<g id="proofs-and-meaning" data-pptx-bounds="48 585 928 115"><text font-size="22" x="56" y="616">Each supplied test: Proof. simpl. reflexivity. Qed.</text><text font-size="22" x="56" y="650">x = y is a proposition to prove.</text><text font-size="22" x="56" y="684">x =? y is a boolean expression to compute.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 876–909                                                        34 / 80</text></svg>