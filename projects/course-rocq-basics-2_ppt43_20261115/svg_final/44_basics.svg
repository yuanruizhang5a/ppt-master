<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF" /><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY CASE ANALYSIS</text><text x="56" y="100" font-size="34" fill="#14324B">Case analysis with destruct</text></g>
<g id="proof" data-pptx-bounds="48 145 928 270"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="180">Theorem plus_1_neq_0 : forall n : nat,</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="212">  (n + 1) =? 0 = false.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="248">Proof.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="278">  intros n. destruct n as [| n'] eqn:E.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="308">  - reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="338">  - reflexivity.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="368">Qed.</text></g>
<g id="pattern" data-pptx-bounds="48 450 928 235"><text x="56" y="488">destruct generates one subgoal per constructor.</text><text x="56" y="530">as [| n′] names the constructor arguments:</text><text x="56" y="566">O takes none; S takes one, called n′.</text><text x="56" y="614">eqn:E records n = O or n = S n′ in the respective case.</text><text x="56" y="650">Keeping the equation helps document the proof state.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1183–1220                                                      44 / 80</text></svg>