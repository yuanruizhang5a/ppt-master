<g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">HOMEWORK SUBMISSION GUIDELINES</text><text x="56" y="100" font-size="34" fill="#14324B">Keep the assignment compatible with grading</text></g>
<g id="rules" data-pptx-bounds="48 145 928 540"><text x="56" y="184">1. Do not change exercise names.</text><text x="56" y="224">The grading scripts must be able to find each solution.</text><text x="56" y="300">2. Do not delete exercises.</text><text x="56" y="340">Leave partial proofs ending with Admitted, not Abort.</text><text x="56" y="416">3. Additional helper definitions and lemmas are fine.</text><text x="56" y="456">Place them before the theorem that uses them.</text><text x="56" y="532">4. If a helper lemma ends with Admitted,</text><text x="56" y="572">the main theorem using it must also end with Admitted.</text><text x="56" y="612">This preserves appropriate partial-credit accounting.</text></g>
