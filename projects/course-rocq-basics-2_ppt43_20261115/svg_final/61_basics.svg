<g id="comparison" data-pptx-bounds="48 140 928 555"><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="174">Definition letter_comparison (l1 l2 : letter) : comparison :=</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="199">  match l1, l2 with</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="224">  | A, A =&gt; Eq</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="249">  | A, _ =&gt; Gt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="274">  | B, A =&gt; Lt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="299">  | B, B =&gt; Eq</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="324">  | B, _ =&gt; Gt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="349">  | C, (A | B) =&gt; Lt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="374">  | C, C =&gt; Eq</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="399">  | C, _ =&gt; Gt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="424">  | D, (A | B | C) =&gt; Lt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="449">  | D, D =&gt; Eq</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="474">  | D, _ =&gt; Gt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="499">  | F, (A | B | C | D) =&gt; Lt</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="524">  | F, F =&gt; Eq</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="549">  end.</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="585">Compute letter_comparison B A.  (* ==&gt; Lt *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="610">Compute letter_comparison D D.  (* ==&gt; Eq *)</text><text font-family="Consolas" font-size="20" xml:space="preserve" x="56" y="635">Compute letter_comparison B F.  (* ==&gt; Gt *)</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1597–1625                                                      61 / 80</text></svg>