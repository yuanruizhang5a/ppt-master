<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Recursion: even and odd</text></g>
<g id="code" data-pptx-bounds="48 145 928 400"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Fixpoint even (n:nat) : bool :=<tspan x="56" dy="28">  match n with</tspan><tspan x="56" dy="28">  | O        =&gt; true</tspan><tspan x="56" dy="28">  | S O      =&gt; false</tspan><tspan x="56" dy="28">  | S (S n') =&gt; even n'</tspan><tspan x="56" dy="28">  end.</tspan><tspan x="56" dy="40">Definition odd (n:nat) : bool := negb (even n).</tspan><tspan x="56" dy="40">Example test_odd1: odd 1 = true.</tspan><tspan x="56" dy="26">Proof. simpl. reflexivity. Qed.</tspan><tspan x="56" dy="34">Example test_odd2: odd 4 = false.</tspan><tspan x="56" dy="26">Proof. simpl. reflexivity. Qed.</tspan></text></g>
<g id="recursion" data-pptx-bounds="48 580 928 105"><text x="56" y="614" font-size="22">Recursion uses Fixpoint; odd reuses even in a Definition.<tspan x="56" dy="34">In these tests, reflexivity can do the work without simpl.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 712–739                                                        27 / 80</text></svg>
