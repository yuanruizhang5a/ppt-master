<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Exposing a definition for rewriting</text></g>
<g id="unfold" data-pptx-bounds="48 145 928 380"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Theorem apply_late_policy_unfold :<tspan x="56" dy="30">  forall (late_days : nat) (g : grade),</tspan><tspan x="56" dy="30">    (apply_late_policy late_days g)</tspan><tspan x="56" dy="30">    =</tspan><tspan x="56" dy="30">    (if late_days &lt;? 9 then g else</tspan><tspan x="56" dy="30">       if late_days &lt;? 17 then lower_grade g</tspan><tspan x="56" dy="30">       else if late_days &lt;? 21 then lower_grade (lower_grade g)</tspan><tspan x="56" dy="30">            else lower_grade (lower_grade (lower_grade g))).</tspan><tspan x="56" dy="40">Proof.</tspan><tspan x="56" dy="30">  intros. reflexivity.</tspan><tspan x="56" dy="30">Qed.</tspan></text></g>
<g id="purpose" data-pptx-bounds="48 565 928 120"><text x="56" y="604">reflexivity proves the definition equals its own body.<tspan x="56" dy="40">This equality lets rewrite expose that body in later proofs.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1856–1882                                                      72 / 80</text></svg>
