<g id="constructors" data-pptx-bounds="48 420 928 270"><text x="56" y="456">Inductive introduces constructors and groups them into a type.<tspan x="56" dy="44">A constructor expression must obey argument counts and types.</tspan></text><text x="56" y="570" font-family="Consolas" font-size="20" xml:space="preserve">Valid:    red      true      primary red<tspan x="56" dy="42">Invalid:  red primary   true red   primary (primary red)</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 414–449 · New Types from Old                                 17 / 80</text></svg>
