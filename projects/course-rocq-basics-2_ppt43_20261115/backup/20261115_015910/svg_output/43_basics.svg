<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY CASE ANALYSIS</text><text x="56" y="100" font-size="34" fill="#14324B">When simplification gets stuck</text></g>
<g id="attempt" data-pptx-bounds="48 145 928 250"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Theorem plus_1_neq_0_firsttry : forall n : nat,<tspan x="56" dy="32">  (n + 1) =? 0 = false.</tspan><tspan x="56" dy="36">Proof.</tspan><tspan x="56" dy="30">  intros n.</tspan><tspan x="56" dy="30">  simpl.  (* does nothing! *)</tspan><tspan x="56" dy="30">Abort.</tspan></text></g>
<g id="reason" data-pptx-bounds="48 430 928 255"><text x="56" y="468">plus and eqb both match on their first argument.<tspan x="56" dy="42">An unknown n blocks plus; n + 1 then blocks eqb.</tspan><tspan x="56" dy="48">Consider the possible forms of n separately:</tspan><tspan x="56" dy="40">• n = O: compute the result directly.</tspan><tspan x="56" dy="40">• n = S n′: n + 1 starts with S, enough to make eqb false.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1150–1182 · Proof by Case Analysis                           43 / 80</text></svg>
