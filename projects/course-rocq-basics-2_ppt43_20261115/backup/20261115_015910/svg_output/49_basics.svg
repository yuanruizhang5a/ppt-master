<g id="proof" data-pptx-bounds="48 140 928 555"><text x="56" y="172" font-family="Consolas" font-size="20" xml:space="preserve">Theorem andb3_exchange :<tspan x="56" dy="25">  forall b c d, andb (andb b c) d = andb (andb b d) c.</tspan><tspan x="56" dy="25">Proof.</tspan><tspan x="56" dy="25">  intros b c d. destruct b eqn:Eb.</tspan><tspan x="56" dy="25">  - destruct c eqn:Ec.</tspan><tspan x="56" dy="25">    { destruct d eqn:Ed.</tspan><tspan x="56" dy="25">      - reflexivity.</tspan><tspan x="56" dy="25">      - reflexivity. }</tspan><tspan x="56" dy="25">    { destruct d eqn:Ed.</tspan><tspan x="56" dy="25">      - reflexivity.</tspan><tspan x="56" dy="25">      - reflexivity. }</tspan><tspan x="56" dy="25">  - destruct c eqn:Ec.</tspan><tspan x="56" dy="25">    { destruct d eqn:Ed.</tspan><tspan x="56" dy="25">      - reflexivity.</tspan><tspan x="56" dy="25">      - reflexivity. }</tspan><tspan x="56" dy="25">    { destruct d eqn:Ed.</tspan><tspan x="56" dy="25">      - reflexivity.</tspan><tspan x="56" dy="25">      - reflexivity. }</tspan><tspan x="56" dy="25">Qed.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1311–1330                                                      49 / 80</text></svg>
