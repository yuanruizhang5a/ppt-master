<g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">INTRODUCTION</text><text x="56" y="100" font-size="34" fill="#14324B">Functional programming in two senses</text></g>
<g id="pure-functions" data-pptx-bounds="48 145 928 165"><text x="56" y="180" font-weight="bold" fill="#087E8B">Programs as mathematical functions</text><text x="56" y="226">Without side effects, input → output describes behavior.<tspan x="56" dy="36">This connection supports formal correctness proofs</tspan><tspan x="56" dy="36">and sound informal reasoning about programs.</tspan></text></g>
<g id="first-class" data-pptx-bounds="48 340 928 160"><text x="56" y="374" font-weight="bold" fill="#087E8B">Functions as first-class values</text><text x="56" y="420">Pass functions as arguments, return them as results,<tspan x="56" dy="36">and include them in data structures.</tspan></text></g>
<g id="chapter-path" data-pptx-bounds="48 530 928 155"><text x="56" y="566">Rocq offers algebraic data types, pattern matching,<tspan x="56" dy="36">and polymorphic type systems for abstraction and reuse.</tspan><tspan x="56" dy="48">First half: Gallina programs. Second half: proof tactics.</tspan></text></g>
