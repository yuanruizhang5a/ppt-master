<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#9A5800">EXERCISE · 1 STAR · STANDARD</text><text x="56" y="100" font-size="34" fill="#14324B">plus_id_exercise</text></g>
<g id="exercise" data-pptx-bounds="48 145 928 235"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Theorem plus_id_exercise : forall n m o : nat,<tspan x="56" dy="32">  n = m -&gt; m = o -&gt; n + m = m + o.</tspan><tspan x="56" dy="42">Proof.</tspan><tspan x="56" dy="32">  (* FILL IN HERE *) Admitted.</tspan></text></g>
<g id="admitted" data-pptx-bounds="48 415 928 270"><text x="56" y="452">There are two hypotheses to introduce: n = m and m = o.<tspan x="56" dy="48">Admitted accepts a claim without proving it.</tspan><tspan x="56" dy="42">It can temporarily support a larger proof while lemmas</tspan><tspan x="56" dy="36">are being developed, then be replaced by real proofs.</tspan><tspan x="56" dy="48">Each admission leaves an unchecked assumption.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1085–1112                                                      40 / 80</text></svg>
