<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">Comparison and pattern abbreviations</text></g>
<g id="comparison" data-pptx-bounds="48 145 928 180"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Inductive comparison : Type :=<tspan x="56" dy="30">  | Eq   (* equal *)</tspan><tspan x="56" dy="30">  | Lt   (* less than *)</tspan><tspan x="56" dy="30">  | Gt.  (* greater than *)</tspan></text></g>
<g id="patterns" data-pptx-bounds="48 350 928 345"><text x="56" y="386" font-size="22">A three-way result carries more information than a boolean.<tspan x="56" dy="38">A simultaneous match abbreviates nested matching:</tspan></text><text x="56" y="478" font-family="Consolas" font-size="20" xml:space="preserve">match l1, l2 with    (* shorthand for nested matches *)<tspan x="56" dy="28">| A, A =&gt; Eq</tspan><tspan x="56" dy="28">| A, _ =&gt; Gt</tspan><tspan x="56" dy="28">end</tspan></text><text x="56" y="635" font-size="22">Alternative pattern C, (A | B) covers both C, A and C, B.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1561–1596                                                      60 / 80</text></svg>
