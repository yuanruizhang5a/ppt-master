<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS</text><text x="56" y="100" font-size="34" fill="#14324B">Numbers: choosing a representation</text></g>
<g id="representations" data-pptx-bounds="48 145 928 305"><text x="56" y="180">Earlier enumerated and tuple types were finite.<tspan x="56" dy="42">Natural numbers form an infinite set.</tspan><tspan x="56" dy="54">The same number has several representations:</tspan></text><text x="56" y="348" font-family="Consolas" font-size="20" xml:space="preserve">decimal 123    hexadecimal 7B<tspan x="56" dy="34">octal   173    binary      1111011</tspan></text></g>
<g id="unary" data-pptx-bounds="48 480 928 205"><text x="56" y="518">Binary simplifies hardware; unary simplifies our proofs.<tspan x="56" dy="42">Unary uses a succession of marks ending in zero.</tspan><tspan x="56" dy="42">NatPlayground isolates the chapter’s own nat definition</tspan><tspan x="56" dy="36">from the standard library’s natural numbers.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 564–602 · Numbers                                              23 / 80</text></svg>
