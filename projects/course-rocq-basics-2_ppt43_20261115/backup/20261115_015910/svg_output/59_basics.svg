<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES</text><text x="56" y="100" font-size="34" fill="#14324B">Course Late Policies, Formalized</text></g>
<g id="types" data-pptx-bounds="48 145 928 350"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Module LateDays.<tspan x="56" dy="44">Inductive letter : Type :=</tspan><tspan x="56" dy="30">  | A | B | C | D | F.</tspan><tspan x="56" dy="44">Inductive modifier : Type :=</tspan><tspan x="56" dy="30">  | Plus | Natural | Minus.</tspan><tspan x="56" dy="44">Inductive grade : Type :=</tspan><tspan x="56" dy="30">  Grade (l:letter) (m:modifier).</tspan></text></g>
<g id="meaning" data-pptx-bounds="48 525 928 160"><text x="56" y="564">Model a policy that lowers grades for too many late days.<tspan x="56" dy="42">A grade contains a letter and a modifier.</tspan><tspan x="56" dy="42">“A−” is Grade A Minus; “C” is Grade C Natural.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1532–1560                                                      59 / 80</text></svg>
