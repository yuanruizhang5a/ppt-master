<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Subtraction and exponentiation</text></g>
<g id="minus" data-pptx-bounds="48 145 928 275"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Fixpoint minus (n m:nat) : nat :=<tspan x="56" dy="30">  match n, m with</tspan><tspan x="56" dy="30">  | O   , _    =&gt; O</tspan><tspan x="56" dy="30">  | S _ , O    =&gt; n</tspan><tspan x="56" dy="30">  | S n', S m' =&gt; minus n' m'</tspan><tspan x="56" dy="30">  end.</tspan><tspan x="56" dy="38">End NatPlayground2.</tspan></text></g>
<g id="exp" data-pptx-bounds="48 445 928 245"><text x="56" y="480" font-family="Consolas" font-size="20" xml:space="preserve">Fixpoint exp (base power : nat) : nat :=<tspan x="56" dy="30">  match power with</tspan><tspan x="56" dy="30">  | O =&gt; S O</tspan><tspan x="56" dy="30">  | S p =&gt; mult base (exp base p)</tspan><tspan x="56" dy="30">  end.</tspan></text><text x="56" y="661" font-size="22">A comma allows matching two expressions simultaneously.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 787–804                                                        30 / 80</text></svg>
