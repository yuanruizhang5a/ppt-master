<g id="notation" data-pptx-bounds="48 145 928 350"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Notation "x + y" := (plus x y)<tspan x="56" dy="30">  (at level 50, left associativity) : nat_scope.</tspan><tspan x="56" dy="44">Notation "x - y" := (minus x y)</tspan><tspan x="56" dy="30">  (at level 50, left associativity) : nat_scope.</tspan><tspan x="56" dy="44">Notation "x * y" := (mult x y)</tspan><tspan x="56" dy="30">  (at level 40, left associativity) : nat_scope.</tspan><tspan x="56" dy="44">Check ((0 + 1) + 1) : nat.</tspan></text></g>
<g id="meaning" data-pptx-bounds="48 525 928 155"><text x="56" y="562">Notation changes parsing and pretty-printing.<tspan x="56" dy="42">It does not change the underlying definitions.</tspan><tspan x="56" dy="42">Levels, associativity, and scopes are revisited later.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 829–851                                                        32 / 80</text></svg>
