<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">MORE EXERCISES · COURSE LATE POLICIES</text><text x="56" y="100" font-size="34" fill="#14324B">An edge case invalidates a theorem</text></g>
<g id="attempt" data-pptx-bounds="48 145 928 335"><text x="56" y="178" font-family="Consolas" font-size="20" xml:space="preserve">Theorem lower_letter_lowers: forall (l : letter),<tspan x="56" dy="26">  letter_comparison (lower_letter l) l = Lt.</tspan><tspan x="56" dy="30">Proof.</tspan><tspan x="56" dy="26">  intros l. destruct l.</tspan><tspan x="56" dy="26">  - simpl. reflexivity.</tspan><tspan x="56" dy="26">  - simpl. reflexivity.</tspan><tspan x="56" dy="26">  - simpl. reflexivity.</tspan><tspan x="56" dy="26">  - simpl. reflexivity.</tspan><tspan x="56" dy="26">  - simpl. (* We get stuck here. *)</tspan><tspan x="56" dy="26">Abort.</tspan></text></g>
<g id="edge-case" data-pptx-bounds="48 510 928 185"><text x="56" y="544" font-family="Consolas" font-size="20" xml:space="preserve">Theorem lower_letter_F_is_F: lower_letter F = F.<tspan x="56" dy="30">Proof. simpl. reflexivity. Qed.</tspan></text><text x="56" y="632" font-size="22">The claim fails at F: its lowered result is equal, not less.<tspan x="56" dy="34">The corrected theorem must exclude this boundary case.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1705–1729                                                      66 / 80</text></svg>
