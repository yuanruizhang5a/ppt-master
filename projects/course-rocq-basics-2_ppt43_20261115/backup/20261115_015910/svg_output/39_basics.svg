<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">PROOF BY REWRITING</text><text x="56" y="100" font-size="34" fill="#14324B">Use an equality from the context</text></g>
<g id="proof" data-pptx-bounds="48 145 928 320"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Theorem plus_id_example : forall n m:nat,<tspan x="56" dy="30">  n = m -&gt;</tspan><tspan x="56" dy="30">  n + n = m + m.</tspan><tspan x="56" dy="40">Proof.</tspan><tspan x="56" dy="30">  intros n m.</tspan><tspan x="56" dy="30">  intros H.</tspan><tspan x="56" dy="30">  rewrite -&gt; H.</tspan><tspan x="56" dy="30">  reflexivity.</tspan><tspan x="56" dy="30">Qed.</tspan></text></g>
<g id="directions" data-pptx-bounds="48 500 928 185"><text x="56" y="536">intros introduces the variables and the hypothesis H : n = m.<tspan x="56" dy="40">rewrite replaces n with m; the goal then has equal sides.</tspan><tspan x="56" dy="40">In a proposition, → means implication. In rewrite, it selects</tspan><tspan x="56" dy="36">left-to-right replacement; ← reverses it. → is the default.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 1039–1084 · Proof by Rewriting                               39 / 80</text></svg>
