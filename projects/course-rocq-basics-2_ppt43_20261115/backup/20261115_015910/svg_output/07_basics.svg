<g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · DAYS OF THE WEEK</text><text x="56" y="100" font-size="34" fill="#14324B">The next working day</text></g>
<g id="definition" data-pptx-bounds="48 145 928 355"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Definition next_working_day (d:day) : day :=<tspan x="56" dy="28">  match d with</tspan><tspan x="56" dy="28">  | monday    =&gt; tuesday</tspan><tspan x="56" dy="28">  | tuesday   =&gt; wednesday</tspan><tspan x="56" dy="28">  | wednesday =&gt; thursday</tspan><tspan x="56" dy="28">  | thursday  =&gt; friday</tspan><tspan x="56" dy="28">  | friday    =&gt; monday</tspan><tspan x="56" dy="28">  | saturday  =&gt; monday</tspan><tspan x="56" dy="28">  | sunday    =&gt; monday</tspan><tspan x="56" dy="28">  end.</tspan></text></g>
<g id="types" data-pptx-bounds="48 535 928 140"><text x="56" y="574">The first line declares both argument and return types.<tspan x="56" dy="38">Rocq can often infer types; explicit types aid the reader.</tspan></text></g>
