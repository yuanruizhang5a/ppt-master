<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Ordering: leb and boolean comparison</text></g>
<g id="code" data-pptx-bounds="48 140 928 430"><text x="56" y="170" font-family="Consolas" font-size="20" xml:space="preserve">Fixpoint leb (n m : nat) : bool :=<tspan x="56" dy="25">  match n with</tspan><tspan x="56" dy="25">  | O =&gt; true</tspan><tspan x="56" dy="25">  | S n' =&gt; match m with</tspan><tspan x="56" dy="25">            | O =&gt; false</tspan><tspan x="56" dy="25">            | S m' =&gt; leb n' m'</tspan><tspan x="56" dy="25">            end</tspan><tspan x="56" dy="25">  end.</tspan><tspan x="56" dy="32">Example test_leb1: leb 2 2 = true.</tspan><tspan x="56" dy="25">Example test_leb2: leb 2 4 = true.</tspan><tspan x="56" dy="25">Example test_leb3: leb 4 2 = false.</tspan><tspan x="56" dy="32">Notation "x =? y" := (eqb x y) (at level 70) : nat_scope.</tspan><tspan x="56" dy="25">Notation "x &lt;=? y" := (leb x y) (at level 70) : nat_scope.</tspan><tspan x="56" dy="32">Example test_leb3': (4 &lt;=? 2) = false.</tspan></text></g>
<g id="proofs-and-meaning" data-pptx-bounds="48 585 928 115"><text x="56" y="616" font-size="22">Each supplied test: Proof. simpl. reflexivity. Qed.<tspan x="56" dy="34">x = y is a proposition to prove.</tspan><tspan x="56" dy="34">x =? y is a boolean expression to compute.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 876–909                                                        34 / 80</text></svg>
