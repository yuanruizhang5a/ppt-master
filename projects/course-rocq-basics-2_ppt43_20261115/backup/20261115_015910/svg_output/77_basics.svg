<g id="tests" data-pptx-bounds="48 140 928 490"><text x="56" y="172" font-family="Consolas" font-size="20" xml:space="preserve">Example test_bin_incr1 : (incr (B1 Z)) = B0 (B1 Z).<tspan x="56" dy="25">Admitted.</tspan><tspan x="56" dy="32">Example test_bin_incr2 : (incr (B0 (B1 Z))) = B1 (B1 Z).</tspan><tspan x="56" dy="25">Admitted.</tspan><tspan x="56" dy="32">Example test_bin_incr3 :</tspan><tspan x="56" dy="25">  (incr (B1 (B1 Z))) = B0 (B0 (B1 Z)).</tspan><tspan x="56" dy="25">Admitted.</tspan><tspan x="56" dy="32">Example test_bin_incr4 : bin_to_nat (B0 (B1 Z)) = 2.</tspan><tspan x="56" dy="25">Admitted.</tspan><tspan x="56" dy="32">Example test_bin_incr5 :</tspan><tspan x="56" dy="25">  bin_to_nat (incr (B1 Z)) = 1 + bin_to_nat (B1 Z).</tspan><tspan x="56" dy="25">Admitted.</tspan><tspan x="56" dy="32">Example test_bin_incr6 :</tspan><tspan x="56" dy="25">  bin_to_nat (incr (incr (B1 Z))) = 2 + bin_to_nat (B1 Z).</tspan><tspan x="56" dy="25">Admitted.</tspan><tspan x="56" dy="32">Example test_bin_incr7 : bin_to_nat (B0 (B0 (B0 (B1 Z)))) = 8.</tspan><tspan x="56" dy="25">Admitted.</tspan></text></g>
