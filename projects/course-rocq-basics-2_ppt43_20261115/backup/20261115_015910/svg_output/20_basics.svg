<g id="module" data-pptx-bounds="48 145 928 320"><text x="56" y="184" font-family="Consolas" font-size="20" xml:space="preserve">Module Playground.<tspan x="56" dy="32">  Definition foo : rgb := blue.</tspan><tspan x="56" dy="32">End Playground.</tspan><tspan x="56" dy="48">Definition foo : bool := true.</tspan><tspan x="56" dy="48">Check Playground.foo : rgb.</tspan><tspan x="56" dy="32">Check foo : bool.</tspan></text></g>
<g id="scope" data-pptx-bounds="48 500 928 180"><text x="56" y="540">Modules organize declarations and limit their scope.<tspan x="56" dy="42">After End Playground, its declaration is Playground.foo.</tspan><tspan x="56" dy="42">This lets the chapter reuse names without interference.</tspan></text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 500–519 · Modules                                              20 / 80</text></svg>
