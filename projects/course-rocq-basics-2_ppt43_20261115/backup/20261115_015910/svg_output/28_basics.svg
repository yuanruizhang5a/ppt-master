<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Arial" font-size="24" fill="#263445"><rect id="bg" data-pptx-role="background" width="1024" height="768" fill="#FFFFFF"/><g id="header" data-pptx-bounds="48 20 928 100"><text x="56" y="44" font-size="16" fill="#087E8B">DATA AND FUNCTIONS · NUMBERS</text><text x="56" y="100" font-size="34" fill="#14324B">Recursive addition</text></g>
<g id="definition" data-pptx-bounds="48 145 928 265"><text x="56" y="180" font-family="Consolas" font-size="20" xml:space="preserve">Module NatPlayground2.<tspan x="56" dy="34">Fixpoint plus (n : nat) (m : nat) : nat :=</tspan><tspan x="56" dy="28">  match n with</tspan><tspan x="56" dy="28">  | O =&gt; m</tspan><tspan x="56" dy="28">  | S n' =&gt; S (plus n' m)</tspan><tspan x="56" dy="28">  end.</tspan><tspan x="56" dy="34">Compute (plus 3 2).  (* ===&gt; 5 : nat *)</tspan></text></g>
<g id="reduction" data-pptx-bounds="48 440 928 250"><text x="56" y="474" font-family="Consolas" font-size="20" xml:space="preserve">plus (S (S (S O))) (S (S O))<tspan x="56" dy="32">==&gt; S (plus (S (S O)) (S (S O)))</tspan><tspan x="56" dy="32">==&gt; S (S (plus (S O) (S (S O))))</tspan><tspan x="56" dy="32">==&gt; S (S (S (plus O (S (S O)))))</tspan><tspan x="56" dy="32">==&gt; S (S (S (S (S O))))</tspan></text><text x="56" y="665" font-size="22">Use the successor clause three times, then the zero clause.</text></g><text id="footer" data-pptx-role="footer" x="56" y="738" font-size="14" fill="#586778">Basics.v · 740–771                                                        28 / 80</text></svg>
