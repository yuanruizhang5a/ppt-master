    <text x="104" y="505" font-size="32" font-weight="700" fill="#F8C86C">1 个模型 · 3 项操作 · 2 类属性</text>
    <text x="104" y="550" font-size="20" fill="#FFFFFF"><tspan x="104" dy="0">• Rocq 可重新编译并完成全部定理检查</tspan><tspan x="104" dy="34">• Rust、模型、规约与证明之间具备清晰追踪关系</tspan><tspan x="104" dy="34">• 报告明确记录工具版本、可信边界、限制与复现方法</tspan></text>
